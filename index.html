<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tercer Tiempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECE3; --surface:#F6F8F2; --surface2:#EDF1E9; --ink:#1B2D22; --muted:#56685C; --line:#C6D1C4;
  --pitch:#2E6A46; --pitch-ink:#F3F6EE; --chalk:#F3F1E8; --tierra:#A87348; --amarillo:#E2B021; --rosa:#CF4E72; --turq:#23918E; --violeta:#6B5CA5;
  --good:#2E7D4F; --bad:#B23A48; --gold:#B8901A;
  --display:'Bungee', 'Arial Black', Impact, sans-serif;
  --body:'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13201A; --surface:#1B2B22; --surface2:#21342A; --ink:#EAF0E6; --muted:#9DB0A2; --line:#30473A;
  --pitch:#1F4D33; --pitch-ink:#EAF0E6; --chalk:#F3F1E8; --good:#5BBE84; --bad:#E06A78; --gold:#E2B94A; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#13201A; --surface:#1B2B22; --surface2:#21342A; --ink:#EAF0E6; --muted:#9DB0A2; --line:#30473A;
  --pitch:#1F4D33; --pitch-ink:#EAF0E6; --chalk:#F3F1E8; --good:#5BBE84; --bad:#E06A78; --gold:#E2B94A; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--pitch)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;margin:0}
h2{font-size:1.6rem;letter-spacing:.01em}
h3{font-size:1.05rem}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* ---- barra superior: el portón de la cancha ---- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pitch);color:var(--pitch-ink);border-bottom:4px solid var(--amarillo)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.25rem;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .ball{width:22px;height:22px;border-radius:50%;background:var(--chalk);box-shadow:inset -4px -3px 0 rgba(0,0,0,.18);position:relative}
.brand .ball::after{content:"";position:absolute;inset:6px;background:var(--pitch);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.track{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.track span{font-family:var(--display);font-size:.78rem;min-width:30px;height:30px;padding:0 6px;display:grid;place-items:center;border-radius:6px;background:rgba(255,255,255,.08);color:rgba(243,246,238,.6);flex:none}
.track span.done{background:rgba(255,255,255,.18);color:var(--pitch-ink)}
.track span.now{background:var(--chalk);color:var(--pitch)}
.track span.cl{box-shadow:inset 0 -3px 0 var(--amarillo)}
.navbtns{display:flex;gap:4px}
.navbtns button{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--pitch-ink);border-radius:8px;padding:5px 10px;font-weight:600;font-size:.92rem}
.navbtns button:hover{background:rgba(255,255,255,.1)}

/* ---- layout ---- */
.layout{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:18px 14px 110px}
main{min-width:0}
aside.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:14px}
.layout.solo{grid-template-columns:minmax(0,1fr);max-width:980px}
.layout.solo aside.side{display:none}
@media (max-width:980px){ .layout{grid-template-columns:minmax(0,1fr)} aside.side{display:none} }
@media (max-width:560px){ .brand .bt{display:none} .top-in{gap:8px;padding:7px 10px} .navbtns button{padding:5px 8px} .score .team{font-size:.88rem} .layout{padding-top:12px} h2{font-size:1.35rem} }
.code{font-family:var(--display);font-size:.7rem;opacity:.75;margin-right:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h3{margin-bottom:8px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.screen-head .who{display:flex;align-items:center;gap:10px}
.crest{width:38px;height:38px;border-radius:50% 50% 46% 46%;display:grid;place-items:center;font-family:var(--display);font-size:.7rem;color:#fff;flex:none;border:2px solid rgba(0,0,0,.15)}
.crest.sm{width:24px;height:24px;font-size:.5rem;border-width:1px}
.kicker{font-weight:600;color:var(--muted);font-size:.95rem}

.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:1rem;background:var(--pitch);color:var(--pitch-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--amarillo);color:#2A2205}
.btn.ghost{background:transparent;color:var(--ink);border:1px dashed var(--line)}
.btn.sm{padding:6px 11px;font-size:.9rem;border-radius:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar .in{max-width:1280px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.problems{color:var(--bad);font-weight:600;font-size:.95rem}

/* ---- cartas ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.card{--pc:var(--pitch);position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:100%}
.card.g-gk{--pc:var(--amarillo)} .card.g-def{--pc:var(--turq)} .card.g-vol{--pc:var(--pitch)} .card.g-del{--pc:var(--rosa)} .card.g-com{--pc:var(--tierra)}
.card .band{background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:5px 9px;font-weight:700;font-size:.82rem}
.card.g-gk .band{color:#2A2205}
.card .band .num{font-family:var(--display);font-size:1.05rem}
.card .body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.card .nm{font-weight:700;font-size:1.02rem;line-height:1.15}
.card .nick{font-style:italic;color:var(--muted);font-size:.9rem;line-height:1.15}
.card .stat{position:absolute;right:8px;top:34px;font-family:var(--display);font-size:1.5rem;line-height:1;color:var(--pc);text-align:right}
.card.g-gk .stat{color:var(--gold)}
.card .stat small{display:block;font-family:var(--body);font-weight:700;font-size:.66rem;color:var(--muted)}
.card .fx{font-size:.88rem;margin:4px 0 0;padding-right:4px}
.card .fl{font-size:.82rem;color:var(--muted);font-style:italic;margin:2px 0 0}
.card .edited{display:inline-block;font-size:.72rem;font-weight:700;color:var(--violeta);border:1px solid currentColor;border-radius:5px;padding:0 5px;margin-top:4px;cursor:help;align-self:flex-start}
:root[data-theme="dark"] .card .edited{color:#B5A8F0}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card .edited{color:#B5A8F0} }
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--good)}
.pips.low i.on{background:var(--amarillo)} .pips.zero i{background:var(--bad);opacity:.5}
.tag{font-size:.74rem;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.bad{color:var(--bad);border-color:currentColor;background:transparent}
.tag.good{color:var(--good);border-color:currentColor;background:transparent}
.card.off{opacity:.55}
.card.sel-D{outline:3px solid var(--turq);outline-offset:-1px}
.card.sel-A{outline:3px solid var(--rosa);outline-offset:-1px}
.card.sel-G{outline:3px solid var(--amarillo);outline-offset:-1px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 0;font-size:.8rem;font-weight:700;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.card.big{max-width:340px}
.plain-card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--k,var(--pitch));border-radius:10px;padding:12px 14px}
.plain-card .tt{font-family:var(--display);font-size:1rem;line-height:1.1}
.plain-card .ty{font-size:.78rem;font-weight:700;color:var(--k,var(--pitch));margin-bottom:2px}
.plain-card.evt{--k:var(--violeta)} .plain-card.exc{--k:var(--bad)} .plain-card.spo{--k:var(--turq)} .plain-card.dra{--k:var(--rosa)} .plain-card.obj{--k:var(--gold)} .plain-card.cla{--k:var(--amarillo)}
.choice{cursor:pointer;transition:transform .12s}
.choice:hover{transform:translateY(-2px)}
.choice.on{box-shadow:0 0 0 3px var(--ink)}

/* ---- pizarra / marcador ---- */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{background:var(--pitch);color:var(--chalk);border-radius:12px;padding:10px 14px;position:relative;overflow:hidden}
.meter b{font-family:var(--display);font-size:2.1rem;display:block;line-height:1}
.meter span{font-weight:600;opacity:.85}
.meter.def{background:#1C5652}
.vs-note{font-size:.95rem;color:var(--muted);margin-top:8px}
.board{background:var(--pitch);color:var(--chalk);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.board::before{content:"";position:absolute;inset:10px;border:2px solid rgba(243,241,232,.18);border-radius:8px;pointer-events:none}
.board::after{content:"";position:absolute;left:50%;top:10px;bottom:10px;border-left:2px solid rgba(243,241,232,.18);pointer-events:none}
.score{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.score .team{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;line-height:1.1}
.score .team.away{justify-content:flex-end;text-align:right}
.score .nums{font-family:var(--display);font-size:2.3rem;background:var(--chalk);color:var(--pitch);border-radius:10px;padding:2px 14px;min-width:116px;text-align:center;letter-spacing:.04em}
.score .sub{font-size:.85rem;opacity:.8;font-weight:500}
.ocs{position:relative;z-index:1;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.oc{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:center;background:rgba(0,0,0,.18);border-radius:8px;padding:6px 8px}
.oc .lbl{font-family:var(--display);font-size:.8rem;text-align:center;opacity:.8}
.cmp{display:flex;align-items:center;gap:6px;font-size:.9rem;flex-wrap:wrap}
.cmp.r{justify-content:flex-end}
.die{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--chalk);color:var(--pitch);font-weight:700;font-size:.92rem}
.goal{font-family:var(--display);font-size:.78rem;background:var(--amarillo);color:#2A2205;border-radius:5px;padding:1px 6px}
.miss{opacity:.6;font-size:.82rem}
.mods{font-size:.78rem;opacity:.75;width:100%}
.cmp.r .mods{text-align:right}
@media (max-width:620px){ .oc{grid-template-columns:1fr} .oc .lbl{text-align:left} .cmp.r{justify-content:flex-start} .cmp.r .mods{text-align:left} .score .nums{font-size:1.8rem;min-width:90px} .score .team{font-size:.86rem;gap:6px} .score .team .crest{width:28px;height:28px;font-size:.55rem} }
.match-list{display:flex;flex-direction:column;gap:12px}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mrow .line{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.mrow .line .h{display:flex;gap:8px;align-items:center;font-weight:600}
.mrow .line .a{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-weight:600;text-align:right}
.mrow .res{font-family:var(--display);font-size:1.3rem;min-width:70px;text-align:center}
.mrow.cl{border-color:var(--amarillo);box-shadow:inset 4px 0 0 var(--amarillo)}
.post{font-size:.9rem;color:var(--muted);margin:6px 0 0;padding-left:16px}
details.why{margin-top:8px;font-size:.88rem}
details.why summary{cursor:pointer;font-weight:700;color:var(--muted)}
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.why-grid table{width:100%;border-collapse:collapse}
.why-grid td{padding:2px 4px;border-bottom:1px dotted var(--line);vertical-align:top}
.why-grid td:last-child{text-align:right;font-weight:700;white-space:nowrap}
@media (max-width:620px){ .why-grid{grid-template-columns:1fr} }

/* ---- tablas ---- */
table.tb{width:100%;border-collapse:collapse;font-size:.95rem}
table.tb th{font-weight:700;color:var(--muted);text-align:right;padding:4px 5px;border-bottom:2px solid var(--line);font-size:.85rem}
table.tb th:nth-child(2),table.tb td:nth-child(2){text-align:left}
table.tb td{padding:5px;border-bottom:1px solid var(--line);text-align:right}
table.tb td.club{display:flex;align-items:center;gap:7px}
table.tb tr.me td{background:var(--surface2)}
table.tb .pts{font-family:var(--display);font-size:1rem}
.scroll-x{overflow-x:auto}
.statline{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:600;font-size:.92rem}
.chip b{font-family:var(--display);font-weight:400;font-size:.95rem}
.riv{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.9rem}
.riv .dots{display:flex;gap:3px}
.riv .dots i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.riv .dots i.on{background:var(--amarillo)}

/* ---- portón (privacidad) ---- */
.gate{min-height:56vh;display:grid;place-items:center;text-align:center}
.gate .plate{background:var(--pitch);color:var(--chalk);border-radius:18px;padding:34px 28px;max-width:480px;width:100%;border-bottom:8px solid var(--amarillo)}
.gate h2{font-size:2.1rem;margin:10px 0}
.gate .btn{background:var(--chalk);color:var(--pitch);margin-top:16px}

/* ---- setup ---- */
.hero{background:var(--pitch);color:var(--chalk);border-radius:18px;padding:28px 24px;position:relative;overflow:hidden;margin-bottom:18px}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:.92;letter-spacing:.01em}
.hero h1 span{display:block;color:var(--amarillo)}
.hero p{max-width:56ch;font-size:1.1rem;opacity:.92}
.hero .lines{position:absolute;right:-60px;top:-40px;width:300px;height:300px;border:3px solid rgba(243,241,232,.16);border-radius:50%}
.hero .lines::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:rgba(243,241,232,.25)}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.seat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.seat .top{display:flex;gap:8px;align-items:center;font-weight:700;line-height:1.1}
.seat select,.seat input,.field input,.field select{font:inherit;width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;font-weight:600}
.toggle{display:flex;gap:8px;align-items:flex-start;font-weight:500}
.toggle input{width:18px;height:18px;margin-top:2px}

/* ---- sheet ---- */
dialog.sheet{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:16px;width:min(960px,96vw);max-height:88vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.sheet::backdrop{background:rgba(10,20,14,.55)}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);z-index:1}
.sheet-b{padding:14px 16px 22px;overflow:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 11px;font-weight:600}
.tabs button.on{background:var(--ink);color:var(--surface)}
.log{font-size:.92rem;display:flex;flex-direction:column;gap:2px;max-height:62vh;overflow:auto}
.log div{padding:3px 0;border-bottom:1px dotted var(--line)}
.log .big{font-family:var(--display);font-size:.95rem;padding-top:10px}
.log .good{color:var(--good)} .log .bad{color:var(--bad)} .log .evt{color:var(--violeta)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){ .grid2{grid-template-columns:1fr} }
.section{margin-top:18px}
.section > h3{margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:1.3rem;font-weight:700}
.stepper b{font-family:var(--display);font-size:1.6rem;min-width:30px;text-align:center}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer;font-weight:500}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.dis{opacity:.45;cursor:not-allowed}
.champ{background:var(--amarillo);color:#2A2205;border-radius:18px;padding:22px;text-align:center;margin-bottom:16px}
.champ h2{font-size:clamp(1.8rem,5vw,3rem)}
.lab-out{font-size:.95rem}
.lab-out td{padding:3px 8px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@keyframes roll{0%{transform:rotate(-30deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.oc.fresh .die{animation:roll .35s ease-out}
@media (prefers-reduced-motion: reduce){ .oc.fresh .die{animation:none} .choice{transition:none} }
.hide{display:none!important}

/* ====== v2: más visual, menos texto ====== */
.pc{--pc:var(--pitch);background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 1px 0 var(--line),0 6px 18px -10px rgba(0,0,0,.35);border:1px solid var(--line)}
.pc.g-gk{--pc:var(--amarillo)} .pc.g-def{--pc:var(--turq)} .pc.g-vol{--pc:var(--pitch)} .pc.g-del{--pc:var(--rosa)} .pc.g-com{--pc:var(--tierra)}
.pc .top{background:var(--pc);color:#fff;padding:10px 12px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;position:relative}
.pc.g-gk .top{color:#2A2205}
.pc .val{font-family:var(--display);font-size:2.2rem;line-height:.9;min-width:44px;text-align:center}
.pc .val small{display:block;font-family:var(--body);font-size:.68rem;font-weight:700;opacity:.85;letter-spacing:.02em}
.pc .who{line-height:1.1;padding-right:26px}
.pc .who b{display:block;font-size:1.08rem}
.pc .who span{font-size:.8rem;font-weight:600;opacity:.88}
.pc .num{position:absolute;right:9px;top:7px;font-family:var(--display);font-size:1.15rem;opacity:.3}
.pc .eff{padding:10px 12px;font-size:.95rem;line-height:1.3;flex:1}
.pc .bot{display:flex;justify-content:space-between;align-items:center;padding:0 12px 10px;gap:6px}
.pc.off{opacity:.5;filter:grayscale(.4)}
.pc.pick{cursor:pointer;transition:transform .15s, box-shadow .15s}
.pc.pick:hover{transform:translateY(-3px)}
.pc.on{box-shadow:0 0 0 3px var(--ink),0 10px 24px -10px rgba(0,0,0,.5)}
.price{font-family:var(--display);font-size:.95rem;background:var(--ink);color:var(--surface);border-radius:8px;padding:3px 9px}
.cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}

.xc{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden;box-shadow:0 6px 18px -10px rgba(0,0,0,.35);display:flex;flex-direction:column}
.xc .xh{background:var(--k);color:#fff;padding:9px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.xc .xh small{font-weight:700;font-size:.75rem;opacity:.9}
.xc .xh b{font-family:var(--display);font-weight:400;font-size:1.05rem;line-height:1.05}
.xc .xb{padding:11px 13px;font-size:1rem;line-height:1.3;flex:1}
.xc.evt{--k:var(--violeta)} .xc.exc{--k:var(--bad)} .xc.spo{--k:var(--turq)} .xc.dra{--k:var(--rosa)} .xc.obj{--k:var(--gold)} .xc.cla{--k:#B98A10}
.xc.big .xh b{font-size:1.5rem} .xc.big .xb{font-size:1.12rem}
.xc.pick{cursor:pointer;transition:transform .15s}
.xc.pick:hover{transform:translateY(-3px)}
.xc.on{box-shadow:0 0 0 3px var(--ink)}

/* cancha */
.pitch{border-radius:18px;padding:12px;position:relative;overflow:hidden;color:var(--chalk);
 background:repeating-linear-gradient(180deg,#2F7A4C 0 56px,#2A6F45 56px 112px);box-shadow:inset 0 0 0 3px rgba(243,241,232,.55),inset 0 0 0 10px #2A6F45,inset 0 0 0 12px rgba(243,241,232,.35)}
:root[data-theme="dark"] .pitch{background:repeating-linear-gradient(180deg,#22593A 0 56px,#1E5034 56px 112px)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pitch{background:repeating-linear-gradient(180deg,#22593A 0 56px,#1E5034 56px 112px)} }
.pitch .circle{position:absolute;left:50%;top:-70px;width:150px;height:150px;margin-left:-75px;border:2px solid rgba(243,241,232,.35);border-radius:50%;pointer-events:none}
.pitch .area{position:absolute;left:50%;bottom:12px;width:min(60%,320px);height:96px;transform:translateX(-50%);border:2px solid rgba(243,241,232,.35);border-bottom:0;pointer-events:none}
.zone{position:relative;z-index:1;border-radius:12px;padding:8px 8px 10px;margin:6px 0;border:2px dashed transparent;transition:border-color .15s, background .15s}
.zone.target{border-color:rgba(243,241,232,.7);background:rgba(255,255,255,.07);cursor:pointer}
.zone .zh{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px}
.zone .zh span{font-weight:700;font-size:.9rem;opacity:.9}
.zone .zh b{font-family:var(--display);font-size:1.7rem;line-height:1}
.zone .row{justify-content:center;gap:8px;min-height:84px}
.zone .empty{opacity:.65;font-size:.9rem;align-self:center}
.tok{--pc:var(--pitch);width:88px;border:0;border-radius:12px;background:var(--chalk);color:#1B2D22;padding:0 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.25);position:relative;font-family:var(--body)}
.tok.g-gk{--pc:var(--amarillo)} .tok.g-def{--pc:var(--turq)} .tok.g-vol{--pc:#3E8A5C} .tok.g-del{--pc:var(--rosa)} .tok.g-com{--pc:var(--tierra)}
.tok .tv{width:100%;background:var(--pc);color:#fff;border-radius:12px 12px 0 0;font-family:var(--display);font-size:1.3rem;padding:3px 0;line-height:1.1}
.tok.g-gk .tv{color:#2A2205}
.tok .tn{font-weight:700;font-size:.82rem;line-height:1.05;padding:0 4px;text-align:center;min-height:2.1em;display:flex;align-items:center}
.tok .pips i{width:7px;height:7px}
.tok.sel{outline:3px solid var(--amarillo);outline-offset:2px;transform:translateY(-3px)}
.tok.off{opacity:.45}
.tok .badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:.65rem;font-weight:700;border-radius:999px;padding:1px 6px}
.bench{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:12px}
.bench.target{border:2px dashed var(--ink);cursor:pointer}
.bench .zh{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);padding:0 2px 8px}
.bench .row{gap:8px}
.bench .tok{background:var(--surface2);color:var(--ink)}
.opp{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.opp .vs{font-family:var(--display);color:var(--muted)}
.opp .st{margin-left:auto;font-weight:700}
.note{background:var(--surface2);border-left:4px solid var(--rosa);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-weight:500}
.sheetcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;width:100%}
.sheetcard .eff{font-size:.95rem}
.movebtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.movebtns .btn{padding:8px 12px;font-size:.92rem}
.totals{display:flex;gap:14px;align-items:baseline}
.totals b{font-family:var(--display);font-size:1.5rem;font-weight:400}
.totals span{font-weight:600;color:var(--muted);font-size:.9rem}

/* partido */
.ev-hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--violeta);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:16px}
.ev-hero .ico{font-size:2.4rem;line-height:1}
.ev-hero small{font-weight:700;opacity:.85}
.ev-hero h3{font-size:1.4rem;margin:2px 0}
.ev-hero p{margin:0;font-size:1.05rem}
.tl{position:relative;z-index:1;margin-top:12px;display:flex;flex-direction:column;gap:4px}
.tlr{display:grid;grid-template-columns:1fr 46px 1fr;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.16)}
.tlr .mid{text-align:center;font-family:var(--display);font-size:.78rem;opacity:.75}
.tlr .s{display:flex;flex-direction:column;gap:1px}
.tlr .s.r{text-align:right;align-items:flex-end}
.tlr .ev{font-weight:700;font-size:.98rem}
.tlr .ev.g{color:var(--amarillo)}
.tlr .ev.n{opacity:.55;font-weight:500}
.tlr .dc{font-size:.74rem;opacity:.6}
.tlr.fresh{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}
.dots{display:flex;gap:5px;justify-content:center;position:relative;z-index:1;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(243,241,232,.25)}
.dots i.on{background:var(--chalk)}
.board .btnrow{position:relative;z-index:1;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.board .btnrow .btn{background:var(--chalk);color:var(--pitch)}
.board .btnrow .btn.alt{background:transparent;color:var(--chalk);border:1px solid rgba(243,241,232,.45)}
.small-results{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:620px){ .small-results{grid-template-columns:1fr} }
.mini{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:600;font-size:.92rem}
.mini .r{font-family:var(--display);font-size:1.05rem}
.mini .b{text-align:right}

/* tercer tiempo */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;font-family:var(--body)}
.tile b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:400;line-height:1}
.tile span{font-size:.82rem;font-weight:600;color:var(--muted)}
.tile.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.tile.on span{color:var(--surface);opacity:.85}
.tile:disabled{opacity:.4;cursor:not-allowed}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.blk > h3{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.res-hero{display:flex;align-items:center;gap:12px;background:var(--pitch);color:var(--chalk);border-radius:14px;padding:12px 16px}
.res-hero b{font-family:var(--display);font-size:1.6rem;font-weight:400}
.ico{display:inline-grid;place-items:center}

/* setup */
.seat2{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.seat2 .shirt{height:58px;display:flex;align-items:center;gap:10px;padding:0 12px;color:#fff;font-weight:700;line-height:1.1;background:var(--cc)}
.seat2 .inner{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:7px;font-weight:700;color:var(--muted)}
.seg2 button.on{background:var(--ink);color:var(--surface)}
.chip svg{width:16px;height:16px}

/* ====== v3: jerarquía tipográfica, barras, pasos ====== */
h3{font-family:var(--body);font-weight:700;font-size:1.08rem;letter-spacing:0}
.xc .xh b{font-family:var(--body);font-weight:700;font-size:1.05rem}
.xc.big .xh b{font-size:1.3rem}
.opp .vs{font-family:var(--body);font-weight:700;text-transform:none}
.steps{display:flex;gap:4px;margin:-4px 0 14px;overflow-x:auto;scrollbar-width:none}
.steps span{flex:1;min-width:max-content;text-align:center;font-size:.78rem;font-weight:700;padding:5px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.steps span.now{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.steps span.done{color:var(--good);border-color:var(--good);background:transparent}
.res{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:stretch;margin-top:4px}
@media (max-width:620px){ .res{grid-template-columns:1fr 1fr} .res .bars{grid-column:1/-1} }
.coin{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;min-width:84px}
.coin b{font-family:var(--display);font-size:1.5rem;font-weight:400;line-height:1}
.coin span{font-size:.78rem;font-weight:700;color:var(--muted)}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:86px 1fr 74px;gap:8px;align-items:center;font-size:.85rem;font-weight:700}
.bar .lbl{color:var(--muted)}
.bar .fx{text-align:right;font-size:.8rem}
.bar .fx.pos{color:var(--good)} .bar .fx.neg{color:var(--bad)} .bar .fx.zero{color:var(--muted)}
.track2{position:relative;height:12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.track2 .fill{position:absolute;top:0;bottom:0;border-radius:999px}
.track2 .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.track2 .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.25}
.track2 .num{position:absolute;right:6px;top:-1px;font-size:.7rem;line-height:12px}
.tok .pen{position:absolute;top:-7px;left:-6px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;border-radius:999px;padding:1px 6px}
.statpair{display:flex;gap:6px;margin-top:3px}
.statpair span{font-size:.72rem;font-weight:700;background:rgba(255,255,255,.22);border-radius:6px;padding:1px 6px}
.pc.g-gk .statpair span{background:rgba(0,0,0,.12)}
.banner{border-radius:14px;padding:14px 16px;margin-bottom:12px;font-weight:600;display:flex;gap:12px;align-items:center}
.banner.good{background:var(--good);color:#fff} .banner.bad{background:var(--bad);color:#fff}
.banner b{font-family:var(--display);font-weight:400;font-size:1.2rem;display:block}
.treat{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}
.treat .btn.on{background:var(--ink);color:var(--surface)}
.rollres{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface2);font-weight:700}
.evnote{font-size:.85rem;opacity:.85;margin-top:4px}
.left{font-size:.78rem;font-weight:700;opacity:.9}

/* ====== v4: estilo app de fútbol pro ====== */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface2:#F3F6F4; --ink:#0D1912; --muted:#5D6E65; --line:#DCE3DF;
  --pitch:#0F7A3F; --pitch-ink:#FFFFFF; --acc:#12A150; --acc-ink:#FFFFFF; --gold:#C99700; --bad:#D23B4B; --good:#12A150;
  --hero1:#0B3A24; --hero2:#06150D; --glow:rgba(43,212,106,.35);
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#070D0A; --surface:#101A15; --surface2:#16231C; --ink:#EAF2EC; --muted:#8B9E93; --line:#1F2F26;
  --pitch:#0F5F33; --acc:#2BD46A; --acc-ink:#04140A; --gold:#F2C230; --bad:#FF5A6A; --good:#2BD46A; } }
:root[data-theme="dark"]{
  --bg:#070D0A; --surface:#101A15; --surface2:#16231C; --ink:#EAF2EC; --muted:#8B9E93; --line:#1F2F26;
  --pitch:#0F5F33; --acc:#2BD46A; --acc-ink:#04140A; --gold:#F2C230; --bad:#FF5A6A; --good:#2BD46A; }
body{font-size:16px}
h1,h2,.brand,.track span,.zone .zh b,.score .nums,.coin b,.tile b,.pc .val,.tok .tv,.res-hero b,.stepper b{font-family:var(--display);font-weight:800;letter-spacing:.01em}
h2{font-size:1.85rem;text-transform:uppercase;letter-spacing:.02em}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
header.top{background:linear-gradient(180deg,#0B2A1B,#07140D);border-bottom:1px solid rgba(43,212,106,.35);box-shadow:0 10px 30px -18px rgba(0,0,0,.6)}
body::before{background:#0B2A1B}
.brand{font-size:1.45rem;text-transform:uppercase;letter-spacing:.04em}
.brand .ball{background:#2BD46A;box-shadow:0 0 12px rgba(43,212,106,.6)}
.brand .ball::after{background:#07140D}
.track span{font-size:.95rem;border-radius:8px;background:rgba(255,255,255,.06);color:rgba(234,242,236,.55)}
.track span.now{background:#2BD46A;color:#04140A;box-shadow:0 0 14px rgba(43,212,106,.5)}
.track span.done{background:rgba(255,255,255,.12);color:#EAF2EC}
.track span.cl{box-shadow:inset 0 -3px 0 #F2C230}
.navbtns button{border-color:rgba(255,255,255,.18);font-weight:700}
.btn{background:var(--acc);color:var(--acc-ink);border-radius:12px;font-weight:700;letter-spacing:.01em;box-shadow:0 6px 18px -10px var(--glow)}
.btn.alt{background:var(--surface2);color:var(--ink);box-shadow:none}
.panel,.blk,.bench,.opp,.coin,.bars,.mini,.seat2,.xc,.pc{border-radius:16px}
.panel h3,.blk>h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.steps span{border-radius:10px;text-transform:uppercase;letter-spacing:.05em;font-size:.72rem}
.steps span.now{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.steps span.done{color:var(--acc);border-color:var(--acc)}
.hero{background:radial-gradient(120% 90% at 80% 0%,#1B6B3E 0%,var(--hero1) 45%,var(--hero2) 100%);border:1px solid rgba(43,212,106,.25)}
.hero h1{font-size:clamp(3rem,10vw,5.6rem);text-transform:uppercase;line-height:.85}
.hero h1 span{color:#2BD46A}
.hero .lines{border-color:rgba(43,212,106,.18)}
.actionbar{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ev-hero{background:linear-gradient(120deg,#3B2C86,#1D1648);border:1px solid rgba(160,140,255,.25)}
.ev-hero h3{font-family:var(--display);font-weight:800;font-size:1.6rem;text-transform:uppercase}
.crest{box-shadow:0 2px 8px rgba(0,0,0,.25);font-family:var(--display);font-weight:800}
.pitch{background:repeating-linear-gradient(180deg,#147A44 0 56px,#106B3B 56px 112px)}
:root[data-theme="dark"] .pitch{background:repeating-linear-gradient(180deg,#0E5B32 0 56px,#0B4F2B 56px 112px)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pitch{background:repeating-linear-gradient(180deg,#0E5B32 0 56px,#0B4F2B 56px 112px)} }
.zone .zh span{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem}
.zone .zh b{font-size:2rem}
.tok{border-radius:14px}
.tok .tv{border-radius:14px 14px 0 0;font-size:1.45rem}
table.tb th{text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
table.tb td{padding:7px 5px}
table.tb .pts{font-family:var(--display);font-weight:800;font-size:1.15rem}
.posbar{width:4px;height:22px;border-radius:2px;background:transparent;display:inline-block;vertical-align:middle}
.posbar.top{background:var(--acc)} .posbar.bot{background:var(--bad)}
.form{display:flex;gap:3px;justify-content:flex-end}
.form i{width:16px;height:16px;border-radius:50%;font-style:normal;font-size:.62rem;font-weight:800;display:grid;place-items:center;color:#fff}
.form i.W{background:var(--good)} .form i.D{background:#8B9E93} .form i.L{background:var(--bad)}
.mv{font-size:.7rem;font-weight:800;margin-left:4px} .mv.up{color:var(--good)} .mv.dn{color:var(--bad)}

/* centro de partido */
.mc{background:radial-gradient(120% 120% at 50% -10%,#18733F 0%,#0C3A22 45%,#071A10 100%);color:#EAF2EC;border-radius:20px;padding:16px 14px 14px;margin-bottom:14px;border:1px solid rgba(43,212,106,.22);box-shadow:0 16px 40px -24px rgba(0,0,0,.7);position:relative;overflow:hidden}

.mc-head{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.mc-team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:.95rem;line-height:1.1}
.mc-team .crest{width:52px;height:52px;font-size:.8rem}
.mc-score{text-align:center}
.mc-score b{display:block;font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;letter-spacing:.04em}
.mc-score span{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.12)}
.mc-score span.live{background:#2BD46A;color:#04140A}
.mc-stats{position:relative;margin:14px 4px 4px;display:flex;flex-direction:column;gap:8px}
.st-row{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;font-weight:800;font-family:var(--display);font-size:1.1rem}
.st-row .lab{grid-column:1/-1;text-align:center;font-family:var(--body);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;opacity:.7;margin-bottom:-4px}
.st-row .r{text-align:right}
.st-bars{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.st-bars i{height:6px;border-radius:3px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.st-bars i b{position:absolute;top:0;bottom:0;border-radius:3px}
.st-bars i:first-child b{right:0;background:#2BD46A}
.st-bars i:last-child b{left:0;background:#EAF2EC}
.mc-tl{position:relative;margin-top:14px;display:flex;flex-direction:column;gap:2px}
.mc-tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.14)}
.ev-row{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;gap:6px;min-height:34px}
.ev-row .min{justify-self:center;font-family:var(--display);font-weight:800;font-size:.85rem;background:#071A10;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:2px 8px;position:relative;z-index:1}
.ev-row .l{text-align:right} .ev-row .r{text-align:left}
.ev-row .g{font-weight:700} .ev-row .g::before{content:"⚽ "}
.ev-row .r .g::before{content:""} .ev-row .r .g::after{content:" ⚽"}
.ev-row .n{opacity:.4;font-size:.85rem}
.ev-row .dc{display:block;font-size:.7rem;opacity:.55;font-weight:500}
.ev-row.fresh{animation:pop .4s ease-out}
.mc .btnrow{position:relative;margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mc .btnrow .btn{background:#2BD46A;color:#04140A}

.mc-scorers{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:.82rem;opacity:.85}
.mc-scorers div:last-child{text-align:right}
/* resumen */
.seg3{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg3 button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-weight:800;font-family:var(--display);font-size:1rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.seg3 button.on{background:var(--acc);color:var(--acc-ink)}
.rlist{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700}
.rcard .h{display:flex;align-items:center;gap:8px} .rcard .a{display:flex;align-items:center;gap:8px;justify-content:flex-end;text-align:right}
.rcard .sc{font-family:var(--display);font-weight:800;font-size:1.5rem;background:var(--surface2);border-radius:10px;padding:2px 12px}
.rcard.cl{border-color:var(--gold)}
.rcard .w{color:var(--ink)} .rcard .lose{color:var(--muted);font-weight:500}
.scorers .tb td:nth-child(3){text-align:left}
.goals{font-family:var(--display);font-weight:800;font-size:1.2rem}
.copa{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dotted var(--line);font-size:.9rem}

.cn{display:flex;flex-direction:column;line-height:1.15;font-weight:600}
.cn small{font-size:.72rem;color:var(--acc);font-weight:700}
table.tb td.club{min-width:150px;display:table-cell}
.clubc{display:flex;align-items:center;gap:8px}

.seg2 button.on,.tile.on,.seg button.on,.tabs button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tile.on span{color:var(--acc-ink)}
.opt.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.pc.on,.xc.on{box-shadow:0 0 0 3px var(--acc)}
.frow{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin:6px 0;min-height:76px}
.frow.solo{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.frow .fl{display:flex;justify-content:flex-start;gap:6px}
.frow .fc{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.frow .fr{display:flex;justify-content:flex-end;gap:6px}
.frow.solo .fc{flex-wrap:wrap}
@media (max-width:620px){ .tok{width:78px} .tok .tn{font-size:.76rem} }
.mc-note{position:relative;text-align:center;font-size:.72rem;opacity:.55;margin:6px 0 0}
.ev-row .mods2{opacity:.8;color:#F2C230}
.treat{grid-template-columns:1fr auto auto}
.kname{border:0;background:transparent;text-align:left;padding:4px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--ink)}

.st-row{grid-template-columns:auto 1fr auto} .st-row>span:first-of-type{min-width:34px}
.goalfx{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.goalfx .conf{position:absolute;left:50%;top:58%;width:0;height:0}
.goalfx .conf i{position:absolute;width:8px;height:12px;border-radius:2px;opacity:0;animation:conf 1.4s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 140px)) rotate(var(--r));opacity:0}}
.goalfx .gtxt{position:relative;text-align:center;background:rgba(4,20,10,.82);border:1px solid rgba(43,212,106,.5);border-radius:18px;padding:12px 22px;box-shadow:0 0 40px rgba(43,212,106,.45);animation:gpop 2s ease forwards;display:flex;flex-direction:column;gap:4px;align-items:center}
.goalfx .gtxt b{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;color:#2BD46A;text-shadow:0 0 18px rgba(43,212,106,.7);letter-spacing:.04em}
.goalfx .gtxt span{display:flex;align-items:center;gap:6px;font-weight:700;color:#EAF2EC}
@keyframes gpop{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.12);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.96)}}
.goalfx.calm .gtxt{animation:none}
.mc.glow{box-shadow:0 0 0 2px #2BD46A,0 0 40px rgba(43,212,106,.5);transition:box-shadow .2s}
@media (prefers-reduced-motion: reduce){ .goalfx .conf{display:none} }

.frow{display:flex!important;justify-content:space-evenly;align-items:center;flex-wrap:wrap;gap:8px;margin:6px 0;min-height:76px}
.xc.dra.good{--k:var(--good)}
.xc.dra.good .xh{color:var(--acc-ink)}

function mkCard(r,libre){
  const c={id:r[0],pos:r[1],num:r[2],first:r[3],nick:r[4],last:r[5],val:r[6],fx:r[7],t:r[8],s:r[9],libre};
  if(libre){c.cm=r[10];c.cf=r[11];c.o=r[12]}else c.o=r[10];
  const g=POS[c.pos].g;
  if(AD[c.id]) [c.a,c.d]=AD[c.id];
  else if(g==='gk'){c.a=0;c.d=c.val} else if(g==='def'){c.a=1;c.d=c.val} else if(g==='del'){c.a=c.val;c.d=1} else {c.a=c.val;c.d=c.val}
  c.name=(c.first?c.first+' ':'')+'"'+c.nick+'" '+c.last;
  c.short=c.first?c.first.replace(/^"Profe" /,'')+' '+c.last.split(' ')[0]:c.nick;
  return c;
}

function rng(S){ S.rng=(S.rng+0x6D2B79F5)|0; let t=S.rng; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }
const d6 = S => 1+Math.floor(rng(S)*6);
function shuffle(S,a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(rng(S)*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
const pick = (S,a)=>a[Math.floor(rng(S)*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function log(S,txt,cls){ S.log.push({f:S.fecha,t:txt,c:cls||''}); if(S.log.length>900) S.log.splice(0,S.log.length-900); }

// ---------- creación ----------
function newGame(opts){
  const S={v:1,rng:(opts.seed>>>0)||((Math.random()*2**31)|0),seed:0,fecha:0,phase:'pre',queue:[],log:[],results:[],
    rivalry:[0,0,0],rivTrig:[false,false,false],copas:[null,null,null],event:null,market:[],decks:{},clubs:[],privacy:opts.privacy!==false,
    pending:null,lastView:null,stats:{goals:0,matches:0}};
  S.seed=S.rng;
  S.decks.libres=shuffle(S,LIBRES_RAW.map(r=>r[0]).filter(id=>id!=='l30'));
  S.decks.events=shuffle(S,EVENTOS.map(x=>x.id));
  S.decks.exc=shuffle(S,EXCUSAS.map(x=>x.id));
  S.decks.spo=shuffle(S,SPONSORS.map(x=>x.id));
  S.decks.dra=shuffle(S,DRAMAS.map(x=>x.id));
  S.decks.obj=shuffle(S,OBJETIVOS.map(x=>x.id));
  S.decks.cla=shuffle(S,CLASICOS.map(x=>x.id));
  // asignación de clubes (opts.seats: [{ctrl,name}] para los 6 elegibles)
  let seats=opts.seats.slice();
  if(opts.randomClubs){ const act=seats.filter(s=>s.ctrl!=='vecino'); const order=shuffle(S,[0,1,2,3,4,5]); seats=Array(6).fill(null).map(()=>({ctrl:'vecino',name:''})); act.forEach((s,i)=>seats[order[i]]=s); }
  CLUBS.forEach((c,i)=>{
    const st=i<6?seats[i]:{ctrl:'vecino',name:''};
    S.clubs.push({i,ctrl:st.ctrl,player:st.name||'',squad:[],money:0,favors:0,moral:CFG.START_MORAL,hinchada:0,rep:0,
      sponsor:null,obj:null,objDone:false,objPublic:false,
      st:{pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,adj:0},res:[],
      cur:{},next:{},flags:{everNeg:false,baseExcused:false,ttRepTotal:0,favSpentPrev:false,favSpentNow:false,atkPerm:0,herencia:false,miniLeft:0,bot3:0},
      lineup:null,dramas:[],lastWinIdx:null});
  });
  // plantilla base por sorteo, puesto por puesto, sin repetir
  const managed=S.clubs.filter(c=>c.ctrl!=='vecino');
  ['GK','DD','DI','VCO','VCE','VOF','DC','EXT'].forEach(p=>{
    const pool=shuffle(S,BASE_RAW.filter(r=>r[1]===p).map(r=>r[0]));
    managed.forEach((c,k)=>c.squad.push(mkSq(pool[k],0)));
  });
  managed.forEach(c=>{c.money=CFG.START_MONEY;c.favors=CFG.START_FAV;});
  log(S,'Arranca la liga. Semilla '+S.seed+'.','big');
  startPre(S);
  return S;
}
function mkSq(id,f){return {id,fis:FIS_MAX,consec:0,played:0,susp:0,retired:false,legend:false,joined:f,lastPlayed:-9}}
const managedClubs = S=>S.clubs.filter(c=>c.ctrl!=='vecino');
const humanClubs = S=>S.clubs.filter(c=>c.ctrl==='human');

// ---------- cola de tareas ----------
// tarea: {type, ci, ...}. Las de bots se resuelven solas.
function pushTask(S,t){S.queue.push(t)}
function runBots(S){
  let guard=0;
  while(S.queue.length && guard++<500){
    const t=S.queue[0], c=t.ci!=null?S.clubs[t.ci]:null;
    if(c && c.ctrl==='bot'){ BOT[t.type](S,t); S.queue.shift(); continue; }
    if(t.type==='auto'){ S.queue.shift(); AUTO[t.fn](S,t); continue; }
    return; // tarea humana o pantalla compartida
  }
}
function completeTask(S){ S.queue.shift(); runBots(S); }

// ---------- pretemporada ----------
function startPre(S){
  S.phase='pre'; S.fecha=0;
  const m=managedClubs(S);
  S.market=[];
  const order=shuffle(S,m.map(c=>c.i));
  m.forEach(c=>{ c.obj=S.decks.obj.pop(); c.spoChoices=drawSponsors(S,3); c.offer=sampleLibres(S,OFFERS); });
  order.forEach(ci=>pushTask(S,{type:'preseason',ci}));
  order.forEach(ci=>pushTask(S,{type:'market',ci}));
  pushTask(S,{type:'auto',fn:'endPre'});
  runBots(S);
}
function spoLeft(S,c){ return c.sponsor? Math.max(0,c.spoUntil-S.fecha) : 0; }
function drawSponsors(S,n){ const out=[], skip=[]; while(out.length<n && S.decks.spo.length){ const id=S.decks.spo.pop(); if(SPO[id].dur==='c'&&S.fecha>=CLASICO_FECHA-1) skip.push(id); else out.push(id); } S.decks.spo.unshift(...skip); return out; }
function drawLibres(S,n){ const out=[]; for(let i=0;i<n && S.decks.libres.length;i++) out.push(S.decks.libres.pop()); return out; }
const OFFERS=5;
function sampleLibres(S,n){ return shuffle(S,S.decks.libres.slice()).slice(0,n); }
function returnMarket(S){ S.clubs.forEach(c=>c.offer=null); S.market=[]; }
function marketList(S,c,t){ return t&&t.late ? S.market : (c.offer||[]); }

function signSponsor(S,c,id,initial){
  if(c.sponsor && c.sponsor!==id) S.decks.spo.unshift(c.sponsor);
  c.sponsor=id; const du=SPO[id].dur; c.spoUntil = du==='c' ? CLASICO_FECHA : S.fecha+du;
  if(id==='minimarket'){ c.money+=5; c.flags.miniLeft=3; }
  if(id==='botilleria') c.flags.bot3=0;
  log(S,`${CLUBS[c.i].n} firma con ${SPO[id].n}.`);
}

// ---------- fichajes ----------
function libreCost(S,c,id){
  const k=CARDS[id]; let m=k.cm, f=k.cf;
  return {m,f};
}
function canSign(S,c,id){
  const {m,f}=libreCost(S,c,id);
  if(c.money<m||c.favors<f) return 'Te falta '+(c.money<m?'dinero':'Favores');
  if(c.squad.filter(s=>CARDS[s.id].libre && !s.retired).length>=4) return 'Plantel completo (máx. 4 fichados)';
  return null;
}
function signLibre(S,c,id){
  const {m,f}=libreCost(S,c,id);
  c.money-=m; c.favors-=f; if(f>0) c.flags.favSpentNow=true;
  c.squad.push(mkSq(id,S.fecha));
  S.market=S.market.filter(x=>x!==id); S.decks.libres=S.decks.libres.filter(x=>x!==id); S.clubs.forEach(o=>{ if(o.offer) o.offer=o.offer.filter(x=>x!==id); });
  if(CARDS[id].fx==='onesimo') c.next.skipExcuse=true;
  log(S,`${CLUBS[c.i].n} ficha a ${CARDS[id].name} (${m} dinero${f?` + ${f} Favor`:''}).`,'good');
}

const AUTO={};
AUTO.endPre=(S)=>{
  returnMarket(S);
  // amistoso: cada club gestionado contra un rival al azar (Vecino), lineup automática
  managedClubs(S).forEach(c=>{
    const opp=pick(S,S.clubs.filter(o=>o.ctrl==='vecino'&&o.i!==c.i)) || S.clubs[7];
    autoLineup(S,c);
    const r=playMatch(S,c.i,opp.i,{friendly:true});
    c.money+=1;
    const won=r.g[0]>r.g[1];
    if(won) c.moral=clamp(c.moral+1,0,10);
    log(S,`Amistoso: ${CLUBS[c.i].n} ${r.g[0]}-${r.g[1]} ${CLUBS[opp.i].n}. +1 dinero${won?', +1 Moral':''}.`);
    c.lineup=null;
  });
  S.lastView={type:'pre'};
  startFecha(S,1);
};

// ---------- Fecha ----------
function startFecha(S,f){
  S.fecha=f; S.phase='f1'; S.event=null;
  log(S,`— Fecha ${f}${f===CLASICO_FECHA?' · Fecha de los Clásicos':''} —`,'big');
  managedClubs(S).forEach(c=>{
    c.cur=c.next; c.next={}; c.lineup=null; c.excuse=null;
    c.flags.favSpentPrev=c.flags.favSpentNow; c.flags.favSpentNow=false;
    c.squad.forEach(s=>{ if(s.susp>0){s.suspNow=true;s.susp--;} else s.suspNow=false; });
    if(c.sponsor==='panaderia' && c.res.length && c.res[c.res.length-1]==='L'){ c.moral=clamp(c.moral+1,0,10); }
    if(c.sponsor==='parroquia' && c.res.slice(-2).join('')==='LL'){ c.moral=clamp(c.moral+1,0,10); }
    if(f===CLASICO_FECHA && ['barberia','parroquia'].includes(c.sponsor)){ c.moral=clamp(c.moral+2,0,10); log(S,`${CLUBS[c.i].n}: +2 Moral por ${SPO[c.sponsor].n}.`); }
    if(c.cur.out) c.cur.out.forEach(id=>{ const s=c.squad.find(x=>x.id===id); if(s) s.dramaOut=true; });
  });
  managedClubs(S).forEach(c=>{ pushTask(S,{type:'lineup',ci:c.i}); pushTask(S,{type:'excuse',ci:c.i}); });
  pushTask(S,{type:'auto',fn:'playFecha'});
  runBots(S);
}
function available(S,c,s){ return !s.retired && !s.suspNow && !s.dramaOut && !(c.excuse&&c.excuse.out&&c.excuse.sid===s.id); }

AUTO.playFecha=(S)=>{
  S.preTable=S.clubs.map(c=>({st:{...c.st},res:c.res.slice()}));
  S.preClubs=JSON.parse(JSON.stringify(S.clubs.map(c=>({money:c.money,favors:c.favors,moral:c.moral,hinchada:c.hinchada,rep:c.rep,squad:c.squad,res:c.res,st:c.st,objDone:c.objDone,objFailed:c.objFailed}))));
  S.preRiv={rivalry:S.rivalry.slice(),copas:S.copas.slice()};
  S.event=S.decks.events.pop(); if(!S.decks.events.length) S.decks.events=shuffle(S,EVENTOS.map(x=>x.id).filter(x=>x!==S.event));
  log(S,`Evento: ${EVT[S.event].n}. ${EVT[S.event].t}`,'evt');
  if(S.event==='cumple') managedClubs(S).forEach(c=>c.moral=clamp(c.moral+1,0,10));
  const matches=FIXTURE[S.fecha-1];
  // primero Vecino vs Vecino, después el resto
  const order=matches.slice().sort((a,b)=>(isMgd(S,a)?1:0)-(isMgd(S,b)?1:0));
  const res=[];
  order.forEach(([h,a])=>res.push(playMatch(S,h,a,{})));
  S.results[S.fecha]=matches.map(([h,a])=>res.find(r=>r.h===h&&r.a===a));
  S.phase='matches';
  S.lastView={type:'fecha',f:S.fecha};
  pushTask(S,{type:'show',what:'fecha'});
};
const isMgd=(S,[h,a])=>S.clubs[h].ctrl!=='vecino'||S.clubs[a].ctrl!=='vecino';

// ---------- cálculo de un lado ----------
function baseFor(k,slot){ if(slot==='G') return isGK(k)?k.d:1; if(isGK(k)) return slot==='D'?1:0; return slot==='A'?k.a:k.d; }
function vecLevel(S,ci){ const f=S.fecha; const lv=CLUBS[ci].lv; if(!CFG.VEC_RAMP) return lv[0]; return f>=6?lv[2]:f>=4?lv[1]:lv[0]; }
function moralMod(m){ return m<=1?-2:m<=3?-1:m<=6?0:m<=8?1:2; }
function homeMod(h){ return h>=6?2:h>=3?1:0; }

function sideOf(S,ci,home,oppCi,ctx){
  const c=S.clubs[ci], ev=ctx.friendly?null:S.event;
  const side={ci,home,vec:c.ctrl==='vecino',players:[],atk:0,def:0,bA:[],bD:[],rerolls:0,best2:0,wilson:false,fisTot:0,oc:[]};
  const isClasico=ctx.clasico!=null;
  const evAllowed = !ctx.friendly;
  if(side.vec){
    const lv=vecLevel(S,ci);
    side.atk=lv+CFG.VEC_ATK; side.def=lv+CFG.VEC_DEF;
    side.bA.push([`Nivel de Equipo ${lv} + ${CFG.VEC_ATK}`,side.atk]); side.bD.push([`Nivel de Equipo ${lv} + ${CFG.VEC_DEF}`,side.def]);
    side.fisTot=2; side.fisN=1;
  } else {
    const L=c.lineup;
    const opp=S.clubs[oppCi];
    const lined=[...L.D.map(id=>[id,'D']),...L.A.map(id=>[id,'A'])]; if(L.gk) lined.unshift([L.gk,'G']);
    const cover=c.excuse&&c.excuse.cover; if(cover){ const ex=lined.find(x=>x[0]===c.excuse.sid); if(ex) lined.push([cover,ex[1]]); }
    const cards=lined.map(([id])=>CARDS[id]);
    const nDel=cards.filter(isDel).length, hasVol=cards.some(isVol);
    side.wilson = cards.some(k=>k.fx==='wilson') && !c.flags.wilsonUsed && !L.wilsonHold;
    const hasLibreDel = c.squad.some(s=>!s.retired && CARDS[s.id].libre && CARDS[s.id].pos==='DEL');
    const oppLibreDel = !opp || opp.ctrl==='vecino' ? false : opp.squad.some(s=>!s.retired&&CARDS[s.id].libre&&CARDS[s.id].pos==='DEL');
    lined.forEach(([id,slot])=>{
      const s=c.squad.find(x=>x.id===id), k=CARDS[id];
      const line = slot==='G'?'D':slot;
      let v=baseFor(k,slot), notes=[];
      if(slot==='G'&&!isGK(k)) notes.push('arquero improvisado');
      if(k.fx==='cirilo' && s.played>0){ v=Math.min(v,3); notes.push('ya jugó su gran partido'); }
      if(k.fx==='brandon' && s.consec>0){ v-=2*s.consec; notes.push(`−${2*s.consec} por ${s.consec} Fecha(s) seguidas`); }
      if(k.fx==='deividson' && s.lastPlayed===S.fecha-1){ v-=2; notes.push('−2 jugó la Fecha anterior'); }
      if(k.fx==='eleuterio'&&line==='A'){ v-=1; notes.push('−1 grita más que juega'); }
      // rasgos propios
      const fx=k.fx;
      if(fx==='homeSelf2'&&home){v+=2;notes.push('+2 local')}
      if(fx==='homeSelf1'&&home){v+=1;notes.push('+1 local')}
      if(fx==='pulpo'){v+=2;notes.push('+2 Pulpo')}
      if(fx==='lostPrev2'&&c.res.length&&c.res[c.res.length-1]==='L'){v+=2;notes.push('+2 perdió la anterior')}
      if((fx==='selfD2A1'||fx==='selfD2A2')&&line==='D'){v+=2;notes.push('+2 marca')}
      if(fx==='wilfredo'){v+=2;notes.push('+2 (−1 club en Ocasión 1)')}
      if(fx==='volSelf1'&&hasVol){v+=1;notes.push('+1 con Volante')}
      if(fx==='bautista'&&oppLibreDel){v+=1;notes.push('+1 rival con 9 fichado')}
      if(fx==='twoDel'&&nDel>=2){v+=1;notes.push('+1 dos Delanteros')}
      if(fx==='ubaldo'&&!c.flags.favSpentPrev){v+=1;notes.push('+1 sin Favores')}
      if(fx==='clasico2'&&isClasico){v+=2;notes.push('+2 Clásico')}
      if(fx==='clasicoD1'&&isClasico){v+=1;notes.push('+1 Clásico')}
      if(fx==='anderson'&&!hasLibreDel){v+=2;notes.push('+2 único 9')}
      if(fx==='odd1'&&S.fecha%2===1){v+=1;notes.push('+1 Fecha impar')}
      if(fx==='deonisio'&&nDel>1&&line==='A'){v=3;notes.push('vale 3: no es el único Delantero')}
      if(fx==='baltazar'){v+=1;notes.push('+1')}
      if(fx==='sponsor1'&&c.sponsor){v+=1;notes.push('+1 con Auspiciador')}
      if(fx==='rain1'&&ev==='lluvia'){v+=1;notes.push('+1 lluvia')}
      if(fx==='fortunato'&&ev==='lluvia'){v+=1;notes.push('+1 lluvia')}
      if(fx==='ananias'&&ev==='fisca'){v=0;notes.push('Fiscalización: no juega')}
      if(s.legend){v+=2;notes.push('+2 Leyenda')}
      // físico
      if(s.fis===1&&CFG.FIS_PEN1){v-=CFG.FIS_PEN1;notes.push('−'+CFG.FIS_PEN1+' cansado')} else if(s.fis<=0){v-=2;notes.push('−2 sin Físico')}
      // excusa / drama
      const ex=c.excuse&&c.excuse.sid===id?c.excuse:null;
      if(ex&&ex.minus){v-=1;notes.push('−1 Excusa')}
      if(c.cur.minus2===id){v-=2;notes.push('−2 Drama')}
      if(c.cur.gkMinus2&&slot==='G'){v-=2;notes.push('−2 blooper viral')}
      v=Math.max(0,v);
      let avail=[1,1,1,1,1,1,1];
      if(ex&&ex.half){avail=[0,0,1,1,1,1,1];notes.push('solo 2.º tiempo (Excusa)')}
      const isCover=cover===id;
      if(isCover){avail=[1,1,0,0,0,0,0];}
      if(fx==='marco'&&!ctx.friendly&&!ctx.preview){ const r=d6(S); if(r<=2){avail=[0,0,1,1,1,1,1];notes.push(`llegó tarde (dado ${r})`)} }
      if(fx==='reroll') side.rerolls++;
      if(fx==='best2') side.best2++;
      side.fisTot+=s.fis; side.fisN=(side.fisN||0)+1;
      side.players.push({id,line,v,notes,avail,fx,libre:k.libre,cover:isCover});
    });
    side.atk=0; side.def=0;
    const exName=c.excuse&&c.excuse.sid?CARDS[c.excuse.sid].short:'';
    side.players.forEach(p=>{ const lbl=CARDS[p.id].short+(p.notes.length?' ('+p.notes.join(', ')+')':'');
      if(p.cover){ (p.line==='A'?side.bA:side.bD).push([`${CARDS[p.id].short}: +${p.v} solo en las Ocasiones 1 y 2 (cubre a ${exName})`,0]); return; }
      if(p.line==='A'){side.atk+=p.v;side.bA.push([lbl,p.v])} else {side.def+=p.v;side.bD.push([lbl,p.v])} });
    const addA=(l,v)=>{if(v){side.atk+=v;side.bA.push([l,v])}}, addD=(l,v)=>{if(v){side.def+=v;side.bD.push([l,v])}};
    addD('El arco (base)',CFG.DEF_BASE);
    const mm=moralMod(c.moral); addA(`Moral ${c.moral}`,mm); addD(`Moral ${c.moral}`,mm);
    if(home) addA(`Hinchada Fiel ${c.hinchada} (local)`,homeMod(c.hinchada));
    cards.forEach(k=>{
      if(k.fx==='selfD2A1') addA(k.short+' (marca)',-1);
      if(k.fx==='selfD2A2') addA(k.short+' (marca)',-2);
      if(k.fx==='clubDef1') addD(k.short,1);
      if(k.fx==='awayDef1'&&!home) addD(k.short+' (visita)',1);
    });
    if(c.cur.atk) addA('Drama: técnico',c.cur.atk);
    if(c.cur.def) addD('Drama: técnico',c.cur.def);
    if(c.cur.atkB) addA('Buena noticia: idea del técnico',c.cur.atkB);
    if(c.cur.defB) addD('Buena noticia: idea del técnico',c.cur.defB);
    if(c.flags.atkPerm) addA('Sueño del Ascenso',c.flags.atkPerm);
    if(c.flags.herencia&&home){ addA('Dueño del Potrero',2); if(!ctx.preview) c.flags.herenciaUsed=true; }
    if(c.cur.tactica && !ctx.friendly && !ctx.preview){ const nD=lined.filter(([_,sl])=>sl!=='A').length; if(nD<4){ c.moral=clamp(c.moral-1,0,10); c.cur.tacticaFail=true; } }
  }
  // evento
  if(evAllowed && ev){
    const shield = side.wilson;
    const neg=(l,fnA,fnD)=>{ if(shield){ side.bA.push([l+' (anulado por Wilson)',0]); side.wilsonFired=true; return;} if(fnA){side.atk+=fnA;side.bA.push([l,fnA])} if(fnD){side.def+=fnD;side.bD.push([l,fnD])} };
    if(ev==='luz') neg('Evento: Corte de Luz',-2,0);
    if(ev==='lluvia') neg('Evento: Lluvia',-2,0);
    if(ev==='balon') neg('Evento: Balón',0,-2);
    if(ev==='cumple') neg('Evento: torta',0,-1);
    if(ev==='kermes') neg('Evento: kermés',-1,0);
    if(ev==='cancha'&&!home) neg('Evento: cancha lejana (visita)',-1,0);
    if(shield && ev==='arbitro') side.wilsonFired=true;
    if(side.wilsonFired && !ctx.preview){ c.flags.wilsonUsed=true; log(S,`${CLUBS[ci].n}: Wilson ordena todo y el Evento no los afecta (usa su efecto de la liga).`); }
  }
  return side;
}

// ---------- partido ----------
function playMatch(S,h,a,ctx){
  const cl = !ctx.friendly && S.fecha===CLASICO_FECHA ? CLASICO_PAIRS.findIndex(p=>(p[0]===h&&p[1]===a)||(p[0]===a&&p[1]===h)) : -1;
  if(cl>=0) ctx.clasico=cl;
  let clCard=null;
  if(cl>=0){ clCard=S.decks.cla.pop(); if(!S.decks.cla.length) S.decks.cla=shuffle(S,CLASICOS.map(x=>x.id)); }
  const A=sideOf(S,h,true,a,ctx), B=sideOf(S,a,false,h,ctx);
  const ev=ctx.friendly?null:S.event;
  if(ev==='lluvia'){ const fa=A.fisTot/(A.fisN||1), fb=B.fisTot/(B.fisN||1), t=(x,y)=>`Lluvia: más Físico promedio (${x.toFixed(1)} vs ${y.toFixed(1)})`;
    if(fa>fb+0.001){A.def+=2;A.bD.push([t(fa,fb),2])} else if(fb>fa+0.001){B.def+=2;B.bD.push([t(fb,fa),2])} else { A.bD.push(['Lluvia: Físico parejo, nadie suma',0]); B.bD.push(['Lluvia: Físico parejo, nadie suma',0]); } }
  let n=4; if(ev==='largo') n=6; if(clCard==='reconc') n+=1;
  // árbitro: jugador al azar fuera de una ocasión
  const arb=[null,null];
  if(ev==='arbitro') [A,B].forEach((sd,k)=>{ const c=S.clubs[sd.ci]; if(sd.vec||sd.wilson) return; if(sd.players.some(p=>p.fx==='wences')) return; if(c.sponsor==='taxi') return;
    const p=pick(S,sd.players); arb[k]={id:p.id,o:Math.floor(rng(S)*n)}; });
  const g=[0,0], oc=[], scorers=[[],[]];
  const used=[{r:0,b:0},{r:0,b:0}];
  for(let o=0;o<n;o++){
    const row={o,lines:[]};
    const before=g.slice();
    [[A,B,0],[B,A,1]].forEach(([X,Y,k])=>{
      let atk=X.atk, def=Y.def, mods=[];
      const half=o<2;
      const ocAdj=(sd,line,kk)=>{ let adj=0; sd.players.forEach(p=>{ if(p.line!==line) return;
        const av=p.avail[Math.min(o,6)];
        if(p.cover){ if(av&&p.v){adj+=p.v; mods.push(`${CARDS[p.id].short} cubre (+${p.v})`);} return; }
        if(!av){ if(p.v){adj-=p.v; mods.push(`${CARDS[p.id].short} todavía no llega (−${p.v})`);} }
        else if(arb[kk]&&arb[kk].id===p.id&&arb[kk].o===o){adj-=p.v;mods.push(`Árbitro saca a ${CARDS[p.id].short} (−${p.v})`);}
        else if(line==='A'){
          if(p.fx==='bernabe'){const d=o===n-1?-1:1;adj+=d;mods.push(`Bernabé ${d>0?'+':''}${d}`)}
          if(p.fx==='diesel'){const d=half?-1:1;adj+=d;mods.push(`Diesel ${d>0?'+':''}${d}`)}
          if(p.fx==='losing1'&&before[kk]<before[1-kk]){adj+=1;mods.push('Nicanor +1 (perdiendo)')}
          if(p.fx==='tied2h'&&!half&&before[0]===before[1]){adj+=1;mods.push('Encarnación +1 (empate)')}
        } });
        if(line==='D' && o===0 && sd.players.some(p=>p.fx==='wilfredo'&&p.line==='D')){adj-=1;mods.push('Wilfredo entrando en calor (−1)')}
        return adj; };
      if(!X.vec) atk+=ocAdj(X,'A',k);
      if(!Y.vec) def+=ocAdj(Y,'D',1-k);
      let rA=d6(S), rD=d6(S), note='';
      if(atk+rA<=def+rD){
        const u=used[k];
        if(X.rerolls>u.r && !X.vec){ u.r++; const nr=d6(S); note=`repite ${rA}→${nr}`; rA=nr; }
        else if(X.best2>u.b && !X.vec){ u.b++; const nr=d6(S); note=`segundo dado ${nr}`; rA=Math.max(rA,nr); }
      }
      let goal=atk+rA>def+rD, anul=false;
      if(goal && ev==='red'){ const c=d6(S); if(c===1){goal=false;anul=true;note+=(note?', ':'')+'red rota: gol anulado'} }
      let scorer=null;
      if(goal){ g[k]++; scorer=pickScorer(S,X,o); if(scorer) scorers[k].push(scorer); }
      row.lines.push({k,atk,def,rA,rD,goal,anul,note,mods,scorer});
    });
    oc.push(row);
  }
  const mins=[]; for(let i=0;i<n;i++){ const lo=Math.floor(i*90/n)+2, hi=Math.floor((i+1)*90/n); mins.push(lo+Math.floor(rng(S)*(hi-lo+1))); }
  const r={h,a,g,oc,n,ev,clasico:cl,clCard,friendly:!!ctx.friendly,sides:[slim(A),slim(B)],scorers,post:[],mins};
  if(!ctx.friendly) applyResult(S,r,A,B);
  return r;
}
function slim(sd){return {ci:sd.ci,vec:sd.vec,atk:sd.atk,def:sd.def,bA:sd.bA,bD:sd.bD,players:sd.players.map(p=>({id:p.id,line:p.line,v:p.v}))}}
const VEC_W={ARQ:0,DEF:1,VOL:2,DEL:4};
function pickScorer(S,X,o){
  if(X.vec){ const r=VEC_ROSTER[X.ci].map((p,k)=>({id:'v'+X.ci+'_'+k,w:VEC_W[p[0]]})); const tot=r.reduce((s,p)=>s+p.w,0); let x=rng(S)*tot; for(const p of r){ x-=p.w; if(x<=0) return p.id; } return r[r.length-1].id; }
  const c=X.players.filter(p=>p.line==='A'&&p.v>0&&p.avail[Math.min(o,6)]);
  const pool=c.length?c:X.players.filter(p=>p.v>0);
  const tot=pool.reduce((s,p)=>s+p.v,0); let x=rng(S)*tot;
  for(const p of pool){ x-=p.v; if(x<=0) return p.id; } return pool.length?pool[0].id:null;
}

function applyResult(S,r,A,B){
  const [gh,ga]=r.g, H=S.clubs[r.h], V=S.clubs[r.a];
  S.stats.goals+=gh+ga; S.stats.matches++;
  const upd=(c,gf,gc)=>{ c.st.pj++; c.st.gf+=gf; c.st.gc+=gc; if(gf>gc){c.st.pg++;c.res.push('W')} else if(gf===gc){c.st.pe++;c.res.push('D')} else {c.st.pp++;c.res.push('L')} };
  upd(H,gh,ga); upd(V,ga,gh);
  const post=r.post;
  [[H,gh,ga,A,true],[V,ga,gh,B,false]].forEach(([c,gf,gc,sd,home])=>{
    if(c.ctrl==='vecino') return;
    const nm=CLUBS[c.i].n, w=gf>gc, l=gf<gc;
    if(w){c.moral=clamp(c.moral+1,0,10); c.lastWinIdx=c.res.length-1;}
    if(l) c.moral=clamp(c.moral-1,0,10);
    if(w&&home){ c.hinchada=clamp(c.hinchada+1,0,10); post.push(`${nm}: +1 Hinchada Fiel (ganó de local)`); }
    if(w&&home&&c.sponsor==='vete'){ c.hinchada=clamp(c.hinchada+1,0,10); post.push(`${nm}: +1 Hinchada (Veterinaria)`); }
    const ids=sd.players.map(p=>p.id), has=fx=>sd.players.some(p=>p.fx===fx);
    if(gf===gc&&has('drawMoral')){c.moral=clamp(c.moral+1,0,10);post.push(`${nm}: +1 Moral (Gumercindo, empate)`)}
    if(l&&has('abelardo')){c.moral=clamp(c.moral+1,0,10);post.push(`${nm}: +1 Moral (Abelardo levanta al grupo)`)}
    if(has('eleuterio')){c.moral=clamp(c.moral+1,0,10)}
    if(S.event==='reportaje'){ const d=w?3:l?-1:0; if(d){c.rep=clamp(c.rep+d,0,30);post.push(`${nm}: ${d>0?'+':''}${d} Reputación (reportaje)`)} }
    if(c.cur.bets){ const d=w?2:l?-2:0; if(d){c.rep=clamp(c.rep+d,0,30);post.push(`${nm}: ${d>0?'+':''}${d} Reputación (apuestas)`)} }
    if(c.cur.tacticaFail) post.push(`${nm}: −1 Moral (no alineó 4 atrás, el grupo se dividió)`);
    if(c.flags.herenciaUsed){c.flags.herencia=false;c.flags.herenciaUsed=false}
    // banco enojado
    c.squad.forEach(s=>{ const k=CARDS[s.id]; if((k.fx==='bench1'||k.fx==='bench2') && available(S,c,s) && !ids.includes(s.id)){ const d=k.fx==='bench1'?1:2; c.moral=clamp(c.moral-d,0,10); post.push(`${nm}: −${d} Moral (${k.short} se enojó en el banco)`);} });
    // sanciones
    let protect=has('facundo');
    sd.players.forEach(p=>{ const k=CARDS[p.id]; if(k.fx==='sancion'||k.fx==='fortunato'){ const roll=d6(S); if(roll===1){ if(protect){protect=false;post.push(`${nm}: Facundo evita la sanción de ${k.short}`)} else { c.squad.find(s=>s.id===p.id).susp=1; post.push(`${nm}: ${k.short} sancionado, se pierde la próxima Fecha`);} } } });
    // jugadores que jugaron
    c.squad.forEach(s=>{ if(ids.includes(s.id)){ s.played++; if(CARDS[s.id].fx==='zorro'){s.retired=true;post.push(`${nm}: El Zorro jugó su partido y se retiró (esta vez sí).`)} } });
    applyFisico(S,c,ids);
    // excomp
    if(r.clCard==='excomp'){ const k=r.h===c.i?0:1; const n=r.scorers[k].filter(id=>CARDS[id].libre).length; if(n){c.rep=clamp(c.rep+2*n,0,30);post.push(`${nm}: +${2*n} Reputación (goles de fichados en el Clásico)`)} }
  });
  // Clásico
  if(r.clasico>=0){
    const p=CLASICO_PAIRS[r.clasico], riv=S.rivalry[r.clasico];
    if(gh!==ga){
      const win=gh>ga?H:V;
      let bonus=Math.min(5,riv); if(r.clCard==='vecino') bonus*=2;
      if(win.ctrl!=='vecino'){ win.rep=clamp(win.rep+bonus,0,30); win.favors++; }
      S.copas[r.clasico]=win.i;
      post.push(`${CLUBS[win.i].n} gana el ${p[2]}: se queda con la ${p[3]}${win.ctrl!=='vecino'?`, +1 Favor${bonus?` y +${bonus} Reputación por Rivalidad`:''}`:''}.`);
      if(r.clCard==='herencia'&&win.ctrl!=='vecino'){win.flags.herencia=true;post.push(`${CLUBS[win.i].n} es Dueño del Potrero: +2 Ataque en su próxima Fecha de local.`)}
      if(r.clCard==='copa'&&win.ctrl!=='vecino'){win.hinchada=clamp(win.hinchada+2,0,10);post.push(`${CLUBS[win.i].n}: +2 Hinchada Fiel (Copa de Lata).`)}
      // retiro dorado
      if(win.ctrl!=='vecino' && win.obj==='retiro' && !win.objDone){
        const sd=win.i===r.h?A:B; const cand=sd.players.map(p=>win.squad.find(s=>s.id===p.id)).filter(s=>s&&s.fisPre===FIS_MAX);
        if(cand.length){ const best=cand.sort((x,y)=>CARDS[y.id].val-CARDS[x.id].val)[0]; best.legend=true; completeObj(S,win,`${CARDS[best.id].short} es Leyenda: +2 permanente`); }
      }
    } else post.push(`${p[2]} empatado: la ${p[3]} no cambia de manos.`);
    S.rivalry[r.clasico]=0; S.rivTrig[r.clasico]=false;
  }
  post.forEach(t=>log(S,t));
}

// ---------- Fase 2 ----------
function startPhase2(S){
  S.phase='f2';
  // Rivalidad: +1 en la previa del Clásico
  if(S.fecha===CLASICO_FECHA-1){ S.rivalry=S.rivalry.map(x=>Math.min(5,x+1)); log(S,'La previa calienta los Clásicos: +1 a cada marcador de Rivalidad.','evt'); }
  CLASICO_PAIRS.forEach((p,k)=>{ if(S.fecha<CLASICO_FECHA && S.rivalry[k]>=3 && !S.rivTrig[k]){ S.rivTrig[k]=true; [p[0],p[1]].forEach(ci=>{ if(S.clubs[ci].ctrl!=='vecino') S.clubs[ci].dramas.push(drawDrama(S)); }); log(S,`La Rivalidad del ${p[2]} llegó a 3: Drama extra para ambos.`,'evt'); } });
  // Drama fijo: cada club recibe uno en cada Tercer Tiempo
  managedClubs(S).forEach(c=>{ if(!c.dramas.length) c.dramas.push(drawDrama(S)); });
  const mgd=managedClubs(S);
  mgd.forEach(c=>{ c.spoExpiring = !!c.sponsor && S.fecha>=c.spoUntil && S.fecha<7; if(c.spoExpiring) c.spoOffer=drawSponsors(S,3); });
  mgd.forEach(c=>pushTask(S,{type:'tt',ci:c.i}));
  if(S.fecha<=3){
    mgd.forEach(c=>{ c.offer=sampleLibres(S,OFFERS); pushTask(S,{type:'market',ci:c.i}); });
  } else if(S.fecha<=6 && !S.clubs.some(c=>c.squad.some(s=>s.id==='l30'))){
    S.market=['l30'];
    const order=mgd.map(c=>c.i).sort((x,y)=>tablePos(S,y)-tablePos(S,x));
    order.forEach(ci=>pushTask(S,{type:'market',ci,late:true}));
  }
  pushTask(S,{type:'auto',fn:'endFecha'});
  runBots(S);
}
function drawDrama(S){ if(!S.decks.dra.length) S.decks.dra=shuffle(S,DRAMAS.map(x=>x.id)); return S.decks.dra.pop(); }

// opciones de cada Drama: [{l,ok(c),go(c)}]; sin opciones = automático
function dramaOptions(S,c,id){
  const nm=CLUBS[c.i].n, L=t=>log(S,`${nm}: ${t}`);
  const mor=d=>c.moral=clamp(c.moral+d,0,10), rep=d=>c.rep=clamp(c.rep+d,0,30);
  const rivK=CLASICO_PAIRS.findIndex(p=>p[0]===c.i||p[1]===c.i);
  const bestAtk=()=>{ const a=c.squad.filter(s=>!s.retired&&POS[CARDS[s.id].pos].line!=='D').sort((x,y)=>CARDS[y.id].val-CARDS[x.id].val); return a[0]; };
  switch(id){
    case 'chat': return [{l:'Pagar 1 dinero',ok:()=>c.money>=1,go:()=>{c.money--;L('paga 1 dinero y calma el chat')}},{l:'Aceptar −1 Moral',go:()=>{mor(-1);L('−1 Moral por la pelea en el chat')}}];
    case 'rumor': { const s=bestAtk(); return [{l:`Gastar 1 Moral para convencer a ${CARDS[s.id].short}`,ok:()=>c.moral>=1,go:()=>{mor(-1);L(`convence a ${CARDS[s.id].short} de quedarse (−1 Moral)`)}},{l:`${CARDS[s.id].short} no juega la próxima Fecha`,go:()=>{(c.next.out=c.next.out||[]).push(s.id);L(`${CARDS[s.id].short} se va a probar al rival: no juega la próxima Fecha`)}}]; }
    case 'tecnico': return [{l:'Dar 1 Reputación',ok:()=>c.rep>=1,go:()=>{rep(-1);L('calma al técnico con 1 Reputación')}},{l:'Dar 1 Favor',ok:()=>c.favors>=1,go:()=>{c.favors--;c.flags.favSpentNow=true;L('calma al técnico con 1 Favor')}},{l:'Aceptar −2 Ataque y −2 Defensa la próxima Fecha',go:()=>{c.next.atk=(c.next.atk||0)-2;c.next.def=(c.next.def||0)-2;L('el técnico juega a desgano: −2/−2 la próxima Fecha')}}];
    case 'barras': return [{l:'Aceptar',auto:true,go:()=>{rep(-1); if(rivK>=0&&S.fecha<CLASICO_FECHA){ const p=CLASICO_PAIRS[rivK], o=p[0]===c.i?p[1]:p[0]; S.rivalry[rivK]=Math.min(5,S.rivalry[rivK]+1); L(`−1 Reputación; la Rivalidad con ${CLUBS[o].n} sube a ${S.rivalry[rivK]}`); } else L('−1 Reputación por las barras')}}];
    case 'rifa': return [{l:'Pagar 3 dinero',ok:()=>c.money>=3,go:()=>{c.money-=3;L('repone la plata de la rifa (−3 dinero)')}},{l:'Perder 2 Reputación',go:()=>{rep(-2);L('−2 Reputación por el escándalo de la rifa')}}];
    case 'filtro': return [{l:'Aceptar',auto:true,go:()=>{c.objPublic=true;L(`se filtró su Objetivo Secreto: «${OBJ[c.obj].n}»`)}}];
    case 'brazalete': return [{l:'Gastar 1 Favor',ok:()=>c.favors>=1,go:()=>{c.favors--;c.flags.favSpentNow=true;L('resuelve la disputa por el brazalete con 1 Favor')}},{l:'Aceptar −2 Moral',go:()=>{mor(-2);L('−2 Moral por la disputa del brazalete')}}];
    case 'enterado': if(!c.sponsor) return [{l:'Aceptar',auto:true,go:()=>L('el auspiciador se enteró... pero no tenía auspiciador')}];

    case 'cancha': return [{l:'Aceptar',auto:true,go:()=>{const a=c.squad.filter(s=>!s.retired);const s=pick(S,a);s.fis=Math.max(0,s.fis-1);L(`${CARDS[s.id].short} pierde 1 de Físico por la discusión`)}}];
    case 'hijo': return [{l:'Pagar 2 dinero',ok:()=>c.money>=2,go:()=>{c.money-=2;L('paga 2 dinero para que el hijo del dirigente no juegue')}},{l:'Un titular juega con −2 la próxima Fecha',go:()=>{c.next.minus2Random=true;L('el hijo del dirigente se suma: un titular jugará con −2')}}];
    case 'apuestas': return [{l:'Aceptar',auto:true,go:()=>{c.next.bets=true;L('hay apuestas: la próxima Fecha ±2 Reputación según el resultado')}}];

    case 'camisetas': return [{l:'Aceptar',auto:true,go:()=>{mor(1);c.hinchada=clamp(c.hinchada+1,0,10);L('+1 Moral y +1 Hinchada Fiel por las camisetas nuevas')}}];
    case 'empanadas': return [{l:'Aceptar',auto:true,go:()=>{c.squad.forEach(s=>{if(!s.retired)s.fis=Math.min(FIS_MAX,s.fis+1)});L('todo el plantel recupera +1 de Físico con las empanadas')}}];
    case 'pizarra': return [{l:'+2 Ataque la próxima Fecha',go:()=>{c.next.atkB=(c.next.atkB||0)+2;L('+2 Ataque la próxima Fecha por la idea del técnico')}},{l:'+2 Defensa la próxima Fecha',go:()=>{c.next.defB=(c.next.defB||0)+2;L('+2 Defensa la próxima Fecha por la idea del técnico')}}];
    case 'muni': return [{l:'Aceptar',auto:true,go:()=>{c.favors++;L('+1 Favor por el contacto en la municipalidad')}}];
    case 'bandera': return [{l:'Aceptar',auto:true,go:()=>{c.hinchada=clamp(c.hinchada+2,0,10);L('+2 Hinchada Fiel por la bandera nueva')}}];
    case 'escuelita': return [{l:'+1 Favor',go:()=>{c.favors++;L('+1 Favor por el pibe de la escuelita')}},{l:'+2 Reputación',go:()=>{rep(2);L('+2 Reputación por el pibe de la escuelita')}}];
    case 'radio': return [{l:'Aceptar',auto:true,go:()=>{rep(2);mor(1);L('+2 Reputación y +1 Moral por la entrevista')}}];
