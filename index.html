  }
  return [];
}

function rollDrama(S,c,k){ const ops=dramaOptions(S,c,c.dramas[k]); const n=S.log.length; ops[0].go(); (c.dramaDone=c.dramaDone||{})[k]=S.log.length>n?S.log[S.log.length-1].t.replace(/^[^:]+: /,''):''; }
function ttPreview(S,c,invest){
  let r=invest, parts=[[`Inversión`,invest]];
  const add=(l,v)=>{if(v){r+=v;parts.push([l,v])}};
  if(c.sponsor==='almacen') add('Almacén El Gol',1);
  if(c.sponsor==='botilleria') add('Botillería',2);
  if(c.lineup && c.lineup.played && c.lineup.played.some(id=>CARDS[id].fx==='genaro')) add('Genaro cuenta la jugada',1);
  if(S.event==='parlante') add('Se cortó el parlante',-1);
  if(S.event==='kermes') add('Kermés',2);
  if(c.cur.ttMinus) add('Junta familiar',-1);
  r=Math.max(0,r);
  return {rep:r,parts,hinch:invest>=3?1:0};
}
function favorCost(c){ return c.squad.some(s=>!s.retired&&CARDS[s.id].fx==='hermo')?2:3; }
function sponsorCost(c){ return c.squad.some(s=>!s.retired&&CARDS[s.id].fx==='bryan')?0:1; }
function sponsorBreakRep(c){ return c.squad.some(s=>!s.retired&&CARDS[s.id].fx==='kevin')?0:1; }

// aplica las decisiones del Tercer Tiempo. d={invest, fisca:'pay'|'rep', drama:[optIdx...], spo:id|null, favor:bool}
function applyTT(S,c,d){
  const nm=CLUBS[c.i].n;
  if(S.event==='fisca'){
    const cost=c.sponsor==='ferre'?2:3;
    if(d.fisca==='pay'&&c.money>=cost){c.money-=cost;log(S,`${nm} paga la Fiscalización (−${cost} dinero).`)} else {c.rep=clamp(c.rep-2,0,30);log(S,`${nm} no paga la Fiscalización: −2 Reputación.`)}
  }
  const inv=clamp(d.invest||0,0,Math.min(3,Math.max(0,c.money)));
  const p=ttPreview(S,c,inv);
  c.money-=inv; c.rep=clamp(c.rep+p.rep,0,30); c.flags.ttRepTotal+=p.rep;
  if(p.hinch) c.hinchada=clamp(c.hinchada+1,0,10);
  log(S,`${nm} invierte ${inv} en el Tercer Tiempo: +${p.rep} Reputación${p.hinch?', +1 Hinchada Fiel':''}.`);
  c.dramas.forEach((id,k)=>{ if(c.dramaDone&&c.dramaDone[k]!=null) return; const ops=dramaOptions(S,c,id); let ch=d.drama&&d.drama[k]!=null?d.drama[k]:ops.length-1; if(ops[ch]&&ops[ch].ok&&!ops[ch].ok()) ch=ops.findIndex(o=>!o.ok||o.ok()); (ops[ch]||ops[ops.length-1]).go(); });
  c.dramas=[]; c.dramaDone=null;
  // kinesiólogo
  Object.entries(d.treat||{}).forEach(([id,how])=>{ const s=c.squad.find(x=>x.id===id); if(!s||s.fis>=FIS_MAX) return;
    if(how==='m'&&c.money>=2){ c.money-=2; s.fis=Math.min(FIS_MAX,s.fis+1); log(S,`${nm}: ${CARDS[id].short} va al kinesiólogo (+1 Físico, −$2).`); }
    if(how==='f'&&c.favors>=1){ c.favors--; c.flags.favSpentNow=true; s.fis=Math.min(FIS_MAX,s.fis+2); log(S,`${nm}: ${CARDS[id].short} se recupera con un Favor (+2 Físico).`); } });
  if(d.spo && c.spoExpiring){ c.spoNext=d.spo; d.spo=null; }
  if(d.spo){ const cost=sponsorCost(c), br=c.sponsor?sponsorBreakRep(c):0; if(c.money>=cost){ c.money-=cost; c.rep=clamp(c.rep-br,0,30); signSponsor(S,c,d.spo); } }
  if(c.spoOffer){ c.spoOffer.forEach(x=>{ if(x!==d.spo&&x!==c.spoNext) S.decks.spo.unshift(x) }); c.spoOffer=null; }
  if(d.favor){ const fc=favorCost(c); if(c.rep>=fc){ c.rep-=fc; c.favors++; log(S,`${nm} pide un Favor al barrio (−${fc} Reputación).`); } }
}

AUTO.endFecha=(S)=>{
  returnMarket(S);
  managedClubs(S).forEach(c=>{
    const nm=CLUBS[c.i].n;
    const home=FIXTURE[S.fecha-1].some(m=>m[0]===c.i);
    const won=c.res[c.res.length-1]==='W';
    let inc=CFG.INCOME+(home?CFG.GATE:0), parts=[`cuota ${CFG.INCOME}`]; if(home) parts.push(`taquilla ${CFG.GATE}`);
    const sp=c.sponsor;
    if(sp==='beto'){inc+=3;parts.push('Don Beto 3')}
    if(sp==='ferre'||sp==='taller'||sp==='taxi'){inc+=1;parts.push(SPO[sp].n.split(' ')[0]+' 1')}
    if(sp==='foodtruck'&&home){inc+=2;parts.push('Food Truck 2')}
    if(sp==='heladeria'&&won){inc+=3;parts.push('Heladería 3')}
    if(c.flags.miniLeft>0){inc-=1;c.flags.miniLeft--;parts.push('Minimarket −1')}
    if(sp==='botilleria'){c.flags.bot3++; if(c.flags.bot3%3===0){inc-=1;parts.push('Botillería −1')}}
    if(c.squad.some(s=>!s.retired&&CARDS[s.id].fx==='pulpo')){inc-=1;parts.push('Pulpo −1')}
    if(c.squad.some(s=>!s.retired&&CARDS[s.id].fx==='custodio') && !c.cur.custodioUsed){inc+=1;parts.push('Custodio 1')}
    c.money+=inc;
    if(S.fecha%2===0){ c.favors++; log(S,`${nm}: el barrio le devuelve la mano, +1 Favor.`); }
    if(sp==='fm') c.rep=clamp(c.rep+1,0,30);
    if(sp==='cyber'&&won&&home) c.rep=clamp(c.rep+2,0,30);
    if(sp==='beto'&&c.res.slice(-2).join('')==='LL'){ c.rep=clamp(c.rep-1,0,30); log(S,`${nm}: −1 Reputación, Don Beto está molesto.`); }
    log(S,`${nm} cobra ${inc>=0?'+':''}${inc} dinero (${parts.join(', ')}).`);
    c.squad.forEach(s=>{ const k=CARDS[s.id];
      if(k.fx==='ramon' && S.fecha-s.joined>=2 && !s.retired){ s.retired=true; log(S,`${nm}: Ramón Ojeda vuelve a su club.`); }
      s.dramaOut=false;
    });
    // fin de contrato del auspiciador
    if(c.spoExpiring){ const old=c.sponsor; c.spoExpiring=false; if(old){ S.decks.spo.unshift(old); c.sponsor=null; log(S,`${nm}: termina el contrato con ${SPO[old].n}.`); } if(c.spoNext){ signSponsor(S,c,c.spoNext); c.spoNext=null; } }
    if(c.money<0){ c.flags.everNeg=true; c.moral=clamp(c.moral-1,0,10); log(S,`${nm} cierra la Fecha en rojo: −1 Moral.`,'bad'); }
    checkObjectives(S,c);
  });
  if(S.fecha>=7){ endLeague(S); return; }
  startFecha(S,S.fecha+1);
};

function applyFisico(S,c,ids){
  const played=new Set(ids); let tired=null; const sp=c.sponsor;
  c.squad.forEach(s=>{ if(s.retired) return; const k=CARDS[s.id];
    if(played.has(s.id)){
      let loss=1; if(k.fx==='ronald') loss=0; if(k.fx==='baltazar'||k.fx==='walter') loss++; if(k.fx==='aparicio'&&s.lastPlayed===S.fecha-1) loss++; if(S.event==='largo'&&k.fx!=='ronald') loss++;
      s.fis=Math.max(0,s.fis-loss); s.consec++; s.lastPlayed=S.fecha;
    } else {
      let rec=CFG.REST_REC; if(k.fx==='rec1') rec++; if(k.fx==='rec2') rec+=2; if(sp==='gimnasio') rec++;
      s.fis=Math.min(FIS_MAX,s.fis+rec); s.consec=0;
    }
    if(!tired||s.fis<tired.fis) tired=s;
  });
  if(sp==='farmacia'&&tired&&tired.fis<FIS_MAX) tired.fis++;
}
function completeObj(S,c,txt){ c.objDone=true; c.st.adj+=2; c.objNews='done'; log(S,`${CLUBS[c.i].n} cumple su Promesa al Barrio «${OBJ[c.obj].n}»: ${txt} y +2 puntos.`,'good'); }
function failObj(S,c){ if(c.objFailed||c.objDone) return; c.objFailed=true; c.moral=clamp(c.moral-1,0,10); c.objNews='fail'; log(S,`${CLUBS[c.i].n} no cumplió su Promesa al Barrio: −1 Moral.`,'bad'); }
function checkObjectives(S,c){
  if(c.objDone) return;
  const o=c.obj, f=S.fecha;
  if(o==='ascenso'&&f===4){ if(tablePos(S,c.i)<=2){c.flags.atkPerm=1;completeObj(S,c,'+1 Ataque el resto de la liga')} else failObj(S,c); }
  if(o==='grande'){ if(c.rep>=10){ c.favors++; c.hinchada=clamp(c.hinchada+1,0,10); completeObj(S,c,'+1 Favor y +1 Hinchada Fiel'); } else if(f>=6) failObj(S,c); }
  if(o==='feliz'){ if(c.flags.ttRepTotal>=8){ c.hinchada=clamp(c.hinchada+2,0,10); completeObj(S,c,'+2 Hinchada Fiel'); } else if(f>=6) failObj(S,c); }
  if(o==='deudas'&&f===4){ if(!c.flags.everNeg&&c.money>=6){c.favors++;c.moral=clamp(c.moral+1,0,10);completeObj(S,c,'+1 Favor y +1 Moral')} else failObj(S,c); }
  if(o==='promesa'&&f===5){ if(!c.flags.baseExcused){c.moral=clamp(c.moral+2,0,10);completeObj(S,c,'+2 Moral')} else failObj(S,c); }
  if(o==='retiro'&&f>=CLASICO_FECHA&&!c.objDone) failObj(S,c);
}

function endLeague(S){
  S.phase='end'; S.queue=[{type:'show',what:'end'}];
  const t=table(S);
  log(S,`Termina la liga. Campeón: ${CLUBS[t[0].i].n}.`,'big');
}

// ---------- goleadores ----------
function topScorers(S,upTo){
  const m={}; const last=upTo==null?S.fecha:upTo;
  S.results.forEach((fr,f)=>{ if(!fr||f>last) return; fr.forEach(r=>[0,1].forEach(k=>(r.scorers[k]||[]).forEach(id=>{ const ci=k===0?r.h:r.a; const x=m[id]||(m[id]={id,ci,g:0,last:0}); x.g++; x.last=f; }))); });
  return Object.values(m).sort((a,b)=>b.g-a.g||a.last-b.last||personName(a.id).localeCompare(personName(b.id)));
}
// ---------- tabla ----------
function pts(c){ return c.st.pg*3+c.st.pe+c.st.adj; }
function h2h(S,a,b){ let pa=0,pb=0; S.results.forEach(fr=>fr&&fr.forEach(r=>{ if((r.h===a&&r.a===b)||(r.h===b&&r.a===a)){ const ga=r.h===a?r.g[0]:r.g[1], gb=r.h===a?r.g[1]:r.g[0]; if(ga>gb)pa+=3;else if(gb>ga)pb+=3;else{pa++;pb++} } })); return pa-pb; }
function table(S){
  return S.clubs.slice().sort((x,y)=> pts(y)-pts(x) || (y.st.gf-y.st.gc)-(x.st.gf-x.st.gc) || y.st.gf-x.st.gf || h2h(S,y.i,x.i) || y.rep-x.rep || y.hinchada-x.hinchada || x.i-y.i);
}
function tablePos(S,ci){ return table(S).findIndex(c=>c.i===ci); }

// ---------- alineación ----------
function lineValue(S,c,s,line,slot){
  const k=CARDS[s.id]; let v=baseFor(k,slot==='G'?'G':line);
  if(k.fx==='cirilo'&&s.played>0) v=Math.min(v,3);
  if(k.fx==='brandon') v-=2*s.consec;
  if(k.fx==='deividson'&&s.lastPlayed===S.fecha-1) v-=2;
  if(k.fx==='eleuterio'&&line==='A') v-=1;
  if(k.fx==='pulpo'||k.fx==='wilfredo') v+=2; if(k.fx==='baltazar') v+=1;
  if((k.fx==='selfD2A1'||k.fx==='selfD2A2')&&line==='D') v+=2;
  if(s.legend) v+=2;
  if(s.fis===1) v-=CFG.FIS_PEN1; else if(s.fis<=0) v-=2;
  if(c.excuse&&c.excuse.sid===s.id&&c.excuse.minus) v-=1;
  return Math.max(0,v);
}
function lineupStats(S,c,L){
  let a=0,d=CFG.DEF_BASE;
  const get=id=>c.squad.find(s=>s.id===id);
  if(L.gk) d+=lineValue(S,c,get(L.gk),'D','G');
  L.D.forEach(id=>d+=lineValue(S,c,get(id),'D','D'));
  L.A.forEach(id=>a+=lineValue(S,c,get(id),'A','A'));
  const mm=moralMod(c.moral); a+=mm; d+=mm;
  return {a,d};
}
function lineupProblems(S,c,L){
  const n=(L.gk?1:0)+L.D.length+L.A.length, av=c.squad.filter(s=>available(S,c,s)).length;
  const probs=[];
  if(!L.gk) probs.push('Falta el arquero');
  if(n>7) probs.push('Máximo 7 titulares');
  if(n<Math.min(7,av)) probs.push(`Elegí ${Math.min(7,av)} titulares (llevás ${n})`);
  const com=[L.gk,...L.D,...L.A].filter(id=>id&&CARDS[id].pos==='COM').length; if(com>2) probs.push('Máximo 2 Comodines');
  return probs;
}
function autoLineup(S,c){
  const av=c.squad.filter(s=>available(S,c,s));
  const val=(s,line,slot)=>lineValue(S,c,s,line,slot) - (s.fis<=1&&!['ronald'].includes(CARDS[s.id].fx)?0.6:0) - (CARDS[s.id].fx==='zorro'&&S.fecha!==CLASICO_FECHA&&S.fecha<6?4:0);
  const gks=av.slice().sort((x,y)=>val(y,'D','G')-val(x,'D','G'));
  const gk=gks[0];
  let best=null;
  for(let nd=1;nd<=4;nd++){
    let rest=av.filter(s=>s!==gk);
    const D=rest.slice().sort((x,y)=>(val(y,'D','D')-val(y,'A','A')*0.15)-(val(x,'D','D')-val(x,'A','A')*0.15)).slice(0,nd);
    rest=rest.filter(s=>!D.includes(s));
    const A=rest.sort((x,y)=>val(y,'A','A')-val(x,'A','A')).slice(0,6-nd);
    let com=[gk,...D,...A].filter(s=>s&&CARDS[s.id].pos==='COM').length; if(com>2) continue;
    const sa=A.reduce((t,s)=>t+val(s,'A','A'),0), sd=D.reduce((t,s)=>t+val(s,'D','D'),0)+(gk?val(gk,'D','G'):0);
    let score=sa+sd-0.3*Math.abs(sa-(sd-6));
    if(c.cur.tactica&&nd+1<4) score-=2;
    if(!best||score>best.score) best={score,L:{gk:gk?gk.id:null,D:D.map(s=>s.id),A:A.map(s=>s.id)}};
  }
  c.lineup=best?best.L:{gk:null,D:[],A:[]};
  finalizeLineup(S,c);
}
function finalizeLineup(S,c){
  const L=c.lineup;
  L.played=[L.gk,...L.D,...L.A].filter(Boolean);
  c.squad.forEach(s=>s.fisPre=s.fis);
  if(c.cur.minus2Random&&L.played.length){ c.cur.minus2=pick(S,L.played); }
}

// ---------- excusas ----------
function rollExcuse(S,c){
  if(c.cur.skipExcuse){ c.excuse={skip:true}; log(S,`${CLUBS[c.i].n} se salta la Excusa (Onésimo trajo orden).`); return c.excuse; }
  const L=c.lineup, pool=L.played;
  if(!pool.length){ c.excuse={skip:true}; return c.excuse; }
  const sid=pick(S,pool), k=CARDS[sid];
  const draw=()=>{ if(!S.decks.exc.length) S.decks.exc=shuffle(S,EXCUSAS.map(x=>x.id)); return S.decks.exc.pop(); };
  let eid=draw(), alt=null;
  if(k.fx==='reinaldo'){ alt=draw(); if(EXC_SEVERITY[EXC[alt].k]>EXC_SEVERITY[EXC[eid].k]) [eid,alt]=[alt,eid]; }
  const e=EXC[eid];
  const ex={sid,eid,alt,state:'pending'};
  const immune = (k.fx==='imm:'+e.imm) || (c.sponsor==='taller'&&e.k==='dice');
  if(immune){ ex.state='immune'; }
  if(e.k==='dice'&&!immune){ ex.die=d6(S); }
  c.excuse=ex;
  return ex;
}
function excuseOptions(S,c){
  const ex=c.excuse; if(!ex||ex.skip||ex.state==='immune') return [{id:'ok',l:'Seguir'}];
  const e=EXC[ex.eid], ops=[];
  const cust=c.squad.find(s=>!s.retired&&CARDS[s.id].fx==='custodio'&&available(S,c,s));
  if(e.k==='pay1'){ const cost=c.sponsor==='gomeria'?0:1; ops.push({id:'pay',l:`Pagar ${cost} dinero`,ok:c.money>=cost,cost}); }
  if(e.k==='moral1') ops.push({id:'moral',l:'Gastar 1 de Moral',ok:c.moral>=1});
  if(cust && e.k!=='minus1' && e.k!=='noRep' && !(e.k==='dice'&&ex.die>3)) ops.push({id:'custodio',l:'Custodio la anula (no cobra su +1)',ok:true});
  if(['out','outRep','pay1','moral1'].includes(e.k)) ops.push({id:'accept',l:'Aceptar: no juega',ok:true});
  else ops.push({id:'accept',l:'Aceptar el efecto',ok:true});
  return ops;
}
function resolveExcuse(S,c,choice,replacement){
  const ex=c.excuse, nm=CLUBS[c.i].n;
  if(!ex||ex.skip){return}
  const k=CARDS[ex.sid];
  if(ex.state==='immune'){ log(S,`${nm}: a ${k.short} le toca «${EXC[ex.eid].n}», pero es inmune.`); ex.state='done'; return; }
  const e=EXC[ex.eid];
  if(choice==='pay'){ const cost=c.sponsor==='gomeria'?0:1; c.money-=cost; log(S,`${nm} paga ${cost} y ${k.short} juega igual («${e.n}»).`); ex.state='done'; return; }
  if(choice==='moral'){ c.moral=clamp(c.moral-1,0,10); log(S,`${nm} gasta 1 Moral y ${k.short} juega igual («${e.n}»).`); ex.state='done'; return; }
  if(choice==='custodio'){ c.cur.custodioUsed=true; log(S,`${nm}: Custodio arregla todo y ${k.short} juega igual («${e.n}»).`); ex.state='done'; return; }
  // aceptar
  if(e.k==='out'||e.k==='outRep'||e.k==='pay1'||e.k==='moral1'){
    ex.out=true; if(e.k==='outRep') c.rep=clamp(c.rep-1,0,30);
    if(!k.libre) c.flags.baseExcused=true;
    const L=c.lineup; let slot=null;
    if(L.gk===ex.sid){L.gk=null;slot='G'} else if(L.D.includes(ex.sid)){L.D=L.D.filter(x=>x!==ex.sid);slot='D'} else {L.A=L.A.filter(x=>x!==ex.sid);slot='A'}
    let rep=replacement;
    if(rep===undefined){ // automático: mejor del banco para ese hueco
      const bench=c.squad.filter(s=>available(S,c,s)&&!L.played.includes(s.id));
      bench.sort((x,y)=>lineValue(S,c,y,slot==='A'?'A':'D',slot)-lineValue(S,c,x,slot==='A'?'A':'D',slot));
      rep=bench[0]?bench[0].id:null;
      if(slot==='G'&&!rep){ const pool=[...L.D,...L.A]; if(pool.length){ rep=pool.sort((x,y)=>lineValue(S,c,c.squad.find(s=>s.id===y),'D','G')-lineValue(S,c,c.squad.find(s=>s.id===x),'D','G'))[0]; L.D=L.D.filter(x=>x!==rep); L.A=L.A.filter(x=>x!==rep);} }
    }
    if(rep){ if(slot==='G') L.gk=rep; else if(slot==='D') L.D.push(rep); else L.A.push(rep); }
    log(S,`${nm}: ${k.short} falta («${e.n}»)${e.k==='outRep'?' y el club pierde 1 Reputación':''}.${rep?` Entra ${CARDS[rep].short}.`:replacement===null?'':' Juegan con uno menos.'}`,'bad');
    if(replacement===null) ex.reform=true;
    finalizeLineup(S,c);
  } else if(e.k==='half'||(e.k==='dice'&&ex.die<=3)){ ex.half=true;
    setCover(S,c,replacement);
    log(S,`${nm}: ${k.short} solo llega para el segundo tiempo («${e.n}»${e.k==='dice'?`, dado ${ex.die}`:''}).${ex.cover?` ${CARDS[ex.cover].short} juega el primer tiempo y le deja el lugar.`:' El primer tiempo juegan con uno menos.'}`); }
  else if(e.k==='dice'){ log(S,`${nm}: ${k.short} llega a tiempo (dado ${ex.die}, «${e.n}»).`); }
  else if(e.k==='minus1'){ ex.minus=true; log(S,`${nm}: ${k.short} juega con −1 («${e.n}»).`); }
  else if(e.k==='noRep'){ c.cur.ttMinus=true; log(S,`${nm}: ${k.short} juega, pero el club genera 1 Reputación menos («${e.n}»).`); }
  ex.state='done';
}

function excuseSlot(c){ const L=c.lineup, id=c.excuse.sid; return L.gk===id?'G':L.D.includes(id)?'D':'A'; }
function benchFor(S,c,slot){ const L=c.lineup; const line=slot==='A'?'A':'D'; return c.squad.filter(s=>available(S,c,s)&&!L.played.includes(s.id)).sort((x,y)=>lineValue(S,c,y,line,slot)-lineValue(S,c,x,line,slot)); }
function setCover(S,c,rep){ const ex=c.excuse; let id=rep; if(id===undefined){ const b=benchFor(S,c,excuseSlot(c)); id=b[0]?b[0].id:null; } if(id){ ex.cover=id; c.lineup.played.push(id); } }
function excuseIsHalf(c){ const ex=c.excuse; if(!ex||ex.skip||ex.state==='immune') return false; const e=EXC[ex.eid]; return e.k==='half'||(e.k==='dice'&&ex.die<=3); }

const BOT={};
BOT.preseason=(S,t)=>{ const c=S.clubs[t.ci]; const ch=c.spoChoices.slice().sort((x,y)=>spoScore(y)-spoScore(x)); signSponsor(S,c,ch[0],true); S.decks.spo.unshift(...ch.slice(1)); c.spoChoices=null; };
const SPO_SCORE={beto:6,heladeria:5,foodtruck:4,minimarket:3,gimnasio:4,ferre:3,taller:3,taxi:3,cyber:3,botilleria:3,fm:3,almacen:2.5,farmacia:3,gomeria:2,vete:2.5,parroquia:2,barberia:1.5,panaderia:2};
const spoScore=id=>SPO_SCORE[id]||1;
BOT.market=(S,t)=>{ const c=S.clubs[t.ci];
  const weakest=Math.min(...c.squad.filter(s=>!s.retired).map(s=>Math.max(CARDS[s.id].a,CARDS[s.id].d)));
  const opts=marketList(S,c,t).filter(id=>!canSign(S,c,id)).map(id=>{ const k=CARDS[id],cs=libreCost(S,c,id); let sc=Math.max(k.a,k.d)-weakest-cs.m*0.4-cs.f*0.8; if(k.fx==='ramon'||k.fx==='zorro') sc-=1.5; return {id,sc}; }).filter(o=>o.sc>0.3).sort((a,b)=>b.sc-a.sc);
  if(opts.length && c.money-libreCost(S,c,opts[0].id).m>=1) signLibre(S,c,opts[0].id);
};
BOT.lineup=(S,t)=>{ autoLineup(S,S.clubs[t.ci]); };
BOT.excuse=(S,t)=>{ const c=S.clubs[t.ci]; const ex=rollExcuse(S,c); if(ex.skip) return; const ops=excuseOptions(S,c).filter(o=>o.ok!==false);
  const k=CARDS[ex.sid]; const valuable=k.val>=4;
  let ch='accept'; const o=id=>ops.find(x=>x.id===id);
  if(o('custodio')&&valuable) ch='custodio'; else if(o('pay')&&(valuable||o('pay').cost===0)) ch='pay'; else if(o('moral')&&c.moral>=6&&valuable) ch='moral'; else if(o('ok')) ch='ok';
  resolveExcuse(S,c,ch);
};
BOT.tt=(S,t)=>{ const c=S.clubs[t.ci];
  (c.dramas||[]).forEach((id,k)=>{ const ops=dramaOptions(S,c,id); if(ops[0]&&ops[0].dice) rollDrama(S,c,k); });
  const d={invest:clamp(c.money-4,0,S.fecha>=6?3:2),fisca:c.money>=6?'pay':'rep',drama:[],spo:null,favor:false};
  c.dramas.forEach((id,k)=>{ const ops=dramaOptions(S,c,id); let best=ops.length-1;
    const pref={kermes2:c.money<5?0:1,pizarra:0,escuelita:c.favors<2?0:1,chat:0,rumor:c.moral>=5?0:1,tecnico:c.rep>=2?0:(c.favors>1?1:2),rifa:c.money>=6?0:1,brazalete:c.favors>=2?0:1,enterado:c.money>=4?0:1,camiseta:c.moral>=7?0:1,hijo:c.money>=5?0:1};
    if(pref[id]!=null) best=pref[id]; if(ops[best]&&ops[best].ok&&!ops[best].ok()) best=ops.length-1; d.drama[k]=best; });
  if(c.spoExpiring&&c.spoOffer) d.spo=c.spoOffer.slice().sort((x,y)=>spoScore(y)-spoScore(x))[0];
  else if(!c.sponsor && S.fecha<=6 && c.money>=2){ const off=drawSponsors(S,2); c.spoOffer=off; d.spo=off.slice().sort((x,y)=>spoScore(y)-spoScore(x))[0]; }
  const tired=c.squad.filter(s=>!s.retired&&s.fis===0).sort((x,y)=>Math.max(CARDS[y.id].a,CARDS[y.id].d)-Math.max(CARDS[x.id].a,CARDS[x.id].d));
  d.treat={}; if(tired[0]){ if(c.favors>=2) d.treat[tired[0].id]='f'; else if(c.money>=7) d.treat[tired[0].id]='m'; }
  if(c.favors===0 && c.rep>=favorCost(c)+5 && S.fecha<=3) d.favor=true;
  applyTT(S,c,d);
};

// ---------- simulación de laboratorio ----------
function simLeagues(n,seats,seed){
  const agg={leagues:n,goals:0,matches:0,hvv:{w:0,d:0,l:0},hvh:0,champ:{mgd:0,vec:0},money:0,rep:0,mgdN:0,fisPen:0,fisN:0,byF:Array(8).fill(0).map(()=>({w:0,d:0,l:0})),scoreDist:{},libres:0,draws:0};
  for(let i=0;i<n;i++){
    const S=newGame({seats:seats.map(s=>({ctrl:s==='vecino'?'vecino':'bot',name:''})),seed:(seed||12345)+i*7919,privacy:false});
    let guard=0;
    while(S.phase!=='end' && guard++<200){
      const t=S.queue[0];
      if(t&&t.type==='show'){ S.queue.shift(); if(t.what==='fecha'){ // stats
          S.results[S.fecha].forEach(r=>{ agg.goals+=r.g[0]+r.g[1]; agg.matches++; const k=r.g[0]+'-'+r.g[1]; agg.scoreDist[k]=(agg.scoreDist[k]||0)+1; if(r.g[0]===r.g[1]) agg.draws++;
            const hm=S.clubs[r.h].ctrl!=='vecino', am=S.clubs[r.a].ctrl!=='vecino';
            if(hm!==am){ const mg=hm?r.g[0]:r.g[1], vg=hm?r.g[1]:r.g[0]; const res=mg>vg?'w':mg===vg?'d':'l'; agg.hvv[res]++; agg.byF[S.fecha][res]++; }
            [[r.h,0],[r.a,1]].forEach(([ci,k])=>{ const c=S.clubs[ci]; if(c.ctrl==='vecino'||!c.lineup) return; c.lineup.played.forEach(id=>{ const s=c.squad.find(x=>x.id===id); agg.fisPen+= s.fisPre===1?CFG.FIS_PEN1:s.fisPre<=0?2:0; }); agg.fisN++; });
          });
          startPhase2(S); } continue; }
      if(t){ const c=t.ci!=null?S.clubs[t.ci]:null; if(c&&c.ctrl==='human'){c.ctrl='bot'} runBots(S); if(S.queue[0]===t){ S.queue.shift(); } }
      else break;
    }
    const tb=table(S); if(tb[0].ctrl==='vecino') agg.champ.vec++; else agg.champ.mgd++;
    managedClubs(S).forEach(c=>{agg.money+=c.money;agg.rep+=c.rep;agg.mgdN++;agg.libres+=c.squad.filter(s=>CARDS[s.id].libre).length});
  }
  return agg;
}

function resetUI(){ UI.lineup=null; UI.tt=null; UI.exc=null; UI.pickRep=false; UI.gate=null; UI.sel=null; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }
function applyTheme(){ let t=null; try{t=localStorage.getItem(TKEY)}catch(e){} if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }

// ---------- piezas visuales ----------
const crest=(ci,sm)=>`<span class="crest${sm?' sm':''}" style="background:${CLUBS[ci].c}" aria-hidden="true">${CLUBS[ci].sh}</span>`;
const clubName=ci=>CLUBS[ci].n;
function ctrlLabel(c){ return c.ctrl==='human'?(c.player||'Humano'):c.ctrl==='bot'?'Bot':'Club Vecino'; }

function trackHTML(){
  if(!G) return '';
  const items=[['Pre',0],...[1,2,3,4,5,6,7].map(f=>[f,f])];
  return items.map(([l,f])=>{ const now=G.fecha===f&&G.phase!=='end', done=G.fecha>f||G.phase==='end'; return `<span class="${now?'now':done?'done':''} ${f===CLASICO_FECHA?'cl':''}" title="${f===0?'Pretemporada':'Fecha '+f+(f===CLASICO_FECHA?' (Clásicos)':'')}">${l}</span>`; }).join('');
}
function phaseLabel(){
  if(!G) return '';
  if(G.phase==='pre') return 'Pretemporada';
  if(G.phase==='end') return 'Fin de la liga';
  const p=G.phase==='f2'?'El Tercer Tiempo':'El Partido';
  return `Fecha ${G.fecha} de 7 · ${p}`;
}

function spoilerHidden(){
  if(!G) return false; const h=G.queue[0];
  if(!(h&&h.type==='show'&&h.what==='fecha')) return false;
  const res=G.results[G.fecha]||[];
  return !res.every(r=>(G.clubs[r.h].ctrl==='vecino'&&G.clubs[r.a].ctrl==='vecino')||(UI.reveal[G.fecha+'-'+r.h]||0)>=r.n);
}
function viewClub(c){ return spoilerHidden()&&G.preClubs ? {...c,...G.preClubs[c.i]} : c; }
function tableSource(){
  const h=G.queue[0];
  if(h&&h.type==='show'&&h.what==='fecha'&&G.preTable){
    const res=G.results[G.fecha]||[];
    const all=res.every(r=>(G.clubs[r.h].ctrl==='vecino'&&G.clubs[r.a].ctrl==='vecino')||(UI.reveal[G.fecha+'-'+r.h]||0)>=r.n);
    if(!all) return {...G,clubs:G.clubs.map((c,i)=>({...c,st:G.preTable[i].st,res:G.preTable[i].res})),results:G.results.slice(0,G.fecha)};
  }
  return G;
}
function tableHTML(compact,meCi,prevOrder){
  const src=tableSource(), t=table(src);
  const form=c=>`<span class="form">${c.res.slice(-5).map(r=>`<i class="${r}">${({W:'G',D:'E',L:'P'})[r]}</i>`).join('')}</span>`;
  const mv=(c,i)=>{ if(!prevOrder||G.fecha<2) return ''; const p=prevOrder.indexOf(c.i); if(p<0||p===i) return ''; return p>i?`<span class="mv up">▲${p-i}</span>`:`<span class="mv dn">▼${i-p}</span>`; };
  return `<div class="scroll-x"><table class="tb"><thead><tr><th>#</th><th>Club</th>${compact?'':'<th>PJ</th><th class="w">G</th><th class="w">E</th><th class="w">P</th><th class="w">GF</th><th class="w">GC</th>'}<th>DG</th><th>Pts</th>${compact?'':'<th>Forma</th>'}</tr></thead><tbody>
  ${t.map((c,i)=>`<tr class="${c.i===meCi?'me':''}"><td><span class="posbar ${i===0?'top':''}"></span> ${i+1}${mv(c,i)}</td><td class="club"><div class="clubc">${crest(c.i,true)}<span class="cn">${esc(compact?CLUBS[c.i].sh:clubName(c.i))}${!compact&&c.ctrl==='human'&&c.player?`<small>${esc(c.player)}</small>`:''}</span></div></td>${compact?'':`<td>${c.st.pj}</td><td class="w">${c.st.pg}</td><td class="w">${c.st.pe}</td><td class="w">${c.st.pp}</td><td class="w">${c.st.gf}</td><td class="w">${c.st.gc}</td>`}<td>${c.st.gf-c.st.gc>0?'+':''}${c.st.gf-c.st.gc}</td><td class="pts">${pts(c)}</td>${compact?'':`<td>${form(c)}</td>`}</tr>`).join('')}
  </tbody></table></div>`;
}
function scorersHTML(n,upTo){
  const s=topScorers(G,upTo).slice(0,n||10);
  if(!s.length) return '<p class="muted">Todavía no hay goles.</p>';
  return `<div class="scroll-x scorers"><table class="tb"><thead><tr><th>#</th><th>Jugador</th><th>Club</th><th>Goles</th></tr></thead><tbody>${s.map((x,i)=>`<tr><td>${i+1}</td><td style="text-align:left;font-weight:700">${esc(personName(x.id))}</td><td class="club"><div class="clubc">${crest(x.ci,true)}<span>${esc(CLUBS[x.ci].sh)}</span></div></td><td class="goals">${x.g}</td></tr>`).join('')}</tbody></table></div>`;
}
const shortCtrl=c=>c.ctrl==='human'?(c.player||'Humano'):c.ctrl==='bot'?'Bot':'Vecino';
function rivalryHTML(){
  const hid=spoilerHidden()&&G.preRiv;
  const riv=hid?G.preRiv.rivalry:G.rivalry;
  const pre=G.fecha<CLASICO_FECHA||(G.fecha===CLASICO_FECHA&&(G.phase==='f1'||hid));
  if(pre) return CLASICO_PAIRS.map((p,k)=>`<div class="riv">${crest(p[0],true)}${crest(p[1],true)}<span style="flex:1">${p[2].replace('Clásico ','')}</span><span class="dots" title="Rivalidad ${riv[k]}">${[0,1,2,3,4].map(i=>`<i class="${i<riv[k]?'on':''}"></i>`).join('')}</span></div>`).join('')+`<p class="small muted" style="margin-bottom:0">Rivalidad: el ganador del Clásico suma +1 Reputación por punto. Después de la Fecha 4 deja de contar.</p>`;
  return CLASICO_PAIRS.map((p,k)=>`<div class="copa">🏆 <span style="flex:1">${esc(p[3])}</span>${G.copas[k]!=null?crest(G.copas[k],true)+'<b>'+esc(CLUBS[G.copas[k]].sh)+'</b>':'<span class="muted">Sin dueño</span>'}</div>`).join('');
}
// ---------- render principal ----------
function render(){ renderInner(); bindGlobal(); }
function renderInner(){
  $('#layout').classList.toggle('solo',!G);
  $('#track').innerHTML=trackHTML();
  $('#side').innerHTML=sideHTML();
  const app=$('#app'); setAction('');
  if(!G){ app.innerHTML=setupHTML(); bindSetup(); return; }
  const t=G.queue[0];
  if(!t){ app.innerHTML='<p>Sin tareas. <button class="btn" data-act="new">Nueva liga</button></p>'; return; }
  if(t.type==='show'){ if(t.what==='fecha') return screenFecha(app); if(t.what==='summary') return screenSummary(app); if(t.what==='end') return screenEnd(app); }
  const c=G.clubs[t.ci];
  if(G.privacy && humanClubs(G).length>1 && UI.gate!==t.ci){ return screenGate(app,c,t); }
  UI.gate=t.ci;
  ({preseason:screenPreseason,market:screenMarket,lineup:screenLineup,excuse:screenExcuse,tt:screenTT})[t.type](app,c,t);
}
function bindGlobal(){ bindSheetButtons(); document.querySelectorAll('[data-act="new"]').forEach(b=>b.onclick=newLeague); document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{const el=document.getElementById(b.dataset.jump); if(el) el.scrollIntoView({behavior:'smooth'})}); }
function setAction(html){ const ab=$('#actionbar'); if(!html){ab.classList.add('hide');return} ab.classList.remove('hide'); $('#actionin').innerHTML=html; }
function advance(){ completeTask(G); const n=G.queue[0]; if(!n||n.ci!==UI.gate) UI.gate=null; resetUIKeepGate(); save(); render(); window.scrollTo({top:0}); }
function resetUIKeepGate(){ const g=UI.gate; resetUI(); UI.gate=g; }
// ---------- portón ----------
function screenGate(app,c,t){
  const what={preseason:'Pretemporada',market:'Mercado de la Semana',lineup:'Alineación',excuse:'La Excusa',tt:'El Tercer Tiempo'}[t.type];
  app.innerHTML=`<div class="gate"><div class="plate">${crest(c.i)}<h2>${esc(c.player||'Jugador')}</h2><p>${esc(clubName(c.i))}</p><p class="muted" style="color:rgba(243,241,232,.75)">Te toca: ${what}. Pasá el dispositivo y que nadie mire.</p><button class="btn" id="gateGo">Soy yo, ver mi turno</button></div></div>`;
  $('#gateGo').onclick=()=>{UI.gate=t.ci;render()};
}

function newLeague(){ if(G && G.phase!=='end' && !confirm('¿Abandonar la liga en curso y armar una nueva?')) return; G=null; UNDO=[]; save(); try{localStorage.removeItem(KEY)}catch(e){} closeSheet(); render(); }

// ---------- fin ----------
function screenEnd(app){
  const t=table(G), ch=t[0];
  app.innerHTML=`<div class="champ"><div class="kicker" style="color:#4A3B05">Campeón del barrio</div>${crest(ch.i)}<h2>${esc(clubName(ch.i))}</h2><p>${esc(ctrlLabel(ch))} · ${pts(ch)} puntos</p></div>
  <div class="panel">${tableHTML(false)}</div>
  <div class="section panel"><h3>Goleadores</h3>${scorersHTML(10)}</div>
  <div class="section panel"><h3>Copas de Lata</h3>${rivalryHTML()}</div>
  <div class="section"><h3>Promesas al Barrio</h3><div class="grid2">${managedClubs(G).map(c=>plainCard('obj',clubName(c.i)+' · '+(c.objDone?'cumplida':'no cumplida'),OBJ[c.obj])).join('')}</div></div>
  <div class="section panel"><h3>Números de la liga</h3><p>${G.stats.matches} partidos · ${(G.stats.goals/Math.max(1,G.stats.matches)).toFixed(2)} goles por partido · semilla ${G.seed}</p></div>`;
  setAction(`<button class="btn alt" data-sheet="registro">Ver registro completo</button><button class="btn" data-act="new">Nueva liga</button>`);
  bindSheetButtons();
}

// ---------- hojas ----------
function openSheet(which){
  const d=$('#sheet'), b=$('#sheetBody'), t=$('#sheetTitle');
  const map={tabla:['Tabla de posiciones',sheetTabla],fixture:['Fixture',sheetFixture],clubes:['Clubes',sheetClubes],registro:['Registro de la liga',sheetLog],reglas:['Reglas y ajustes',sheetReglas],lab:['Laboratorio de balance',sheetLab],menu:['Opciones',sheetMenu],cartas:['Todas las cartas',sheetCartas]};
  const [title,fn]=map[which]; t.textContent=title; b.innerHTML=fn(); d.dataset.which=which;
  if(!d.open) d.showModal(); bindSheet(which);
}
function closeSheet(){ const d=$('#sheet'); if(d.open) d.close(); }
function bindSheetButtons(){ document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet)); }
function sheetTabla(){ if(!G) return '<p>No hay liga en curso.</p>'; const tab=UI.tabTab||'t'; return `<div class="seg3"><button data-tt="t" class="${tab==='t'?'on':''}">Posiciones</button><button data-tt="g" class="${tab==='g'?'on':''}">Goleadores</button></div>`+(tab==='t'?tableHTML(false)+`<p class="small muted">Desempate: diferencia de gol, goles a favor, resultado entre ellos, Reputación, Hinchada Fiel.</p><div class="section"><h3>Clásicos</h3>${rivalryHTML()}</div>`:scorersHTML(20,goalsUpTo())); }
function goalsUpTo(){ const h=G.queue[0]; if(h&&h.type==='show'&&h.what==='fecha') return G.fecha-1; return G.fecha; }
function sheetFixture(){ if(!G) return '<p>No hay liga en curso.</p>';
  return FIXTURE.map((fx,i)=>`<div class="section"><h3>Fecha ${i+1}${i+1===CLASICO_FECHA?' · Clásicos':''}</h3><div class="match-list">${fx.map(([h,a])=>{ const r=(G.results[i+1]||[]).find(x=>x.h===h&&x.a===a); const cl=i+1===CLASICO_FECHA&&CLASICO_PAIRS.some(p=>(p[0]===h&&p[1]===a)||(p[0]===a&&p[1]===h)); const showRes=r&&(G.fecha>i+1||G.phase!=='matches'||G.queue[0]?.what!=='fecha'); return `<div class="mrow ${cl?'cl':''}"><div class="line"><div class="h">${crest(h,true)}${esc(clubName(h))}</div><div class="res">${showRes?r.g[0]+' : '+r.g[1]:'—'}</div><div class="a">${esc(clubName(a))}${crest(a,true)}</div></div></div>`; }).join('')}</div></div>`).join(''); }
function sheetClubes(){ if(!G) return '<p>No hay liga en curso.</p>';
  const vis=c=>G.phase==='end'||c.objPublic||c.objDone;
  const vecs=G.clubs.filter(c=>c.ctrl==='vecino');
  if(UI.clubTab!=null && G.clubs[UI.clubTab].ctrl==='vecino'){ const ci=UI.clubTab;
    return `<div class="tabs">${managedClubs(G).map(c=>`<button data-ct="${c.i}">${esc(CLUBS[c.i].sh)}</button>`).join('')}${vecs.map(c=>`<button data-ct="${c.i}" class="${c.i===ci?'on':''}">${esc(CLUBS[c.i].sh)}</button>`).join('')}</div><div class="section"><div class="who row">${crest(ci)}<div><h3>${esc(clubName(ci))}</h3><p class="muted small">Club Vecino · Nivel ${vecLevel(G,ci)} · Ataque ${vecLevel(G,ci)+CFG.VEC_ATK} · Defensa ${vecLevel(G,ci)+CFG.VEC_DEF}</p></div></div><table class="tb section"><tbody>${VEC_ROSTER[ci].map((p,k)=>`<tr><td>#${p[1]}</td><td style="text-align:left"><b>${esc(p[2]+' '+p[4])}</b> <span class="muted small">"${esc(p[3])}"</span></td><td>${({ARQ:'Arquero',DEF:'Defensa',VOL:'Volante',DEL:'Delantero'})[p[0]]}</td></tr>`).join('')}</tbody></table></div>`; }
  return `<div class="tabs" id="clubTabs">${vecs.length?'':''}${managedClubs(G).map((c,k)=>`<button data-ct="${c.i}" class="${(UI.clubTab??managedClubs(G)[0].i)===c.i?'on':''}">${esc(CLUBS[c.i].sh)} · ${esc(shortCtrl(c))}</button>`).join('')}${vecs.map(c=>`<button data-ct="${c.i}">${esc(CLUBS[c.i].sh)}</button>`).join('')}</div>`+
  managedClubs(G).filter(c=>c.i===(UI.clubTab??managedClubs(G)[0].i)).map(viewClub).map(c=>`<div class="section"><div class="who row">${crest(c.i)}<div><h3>${esc(clubName(c.i))}</h3><p class="muted small">"${esc(CLUBS[c.i].m)}"</p></div></div>${resBar(c)}
   <div class="grid2 section"><div>${c.sponsor?plainCard('spo','Auspiciador',SPO[c.sponsor]):'<p class="muted">Sin auspiciador.</p>'}</div><div>${vis(c)?plainCard('obj','Objetivo'+(c.objDone?' (cumplido)':''),OBJ[c.obj]):'<div class="plain-card obj"><div class="ty">Objetivo secreto</div><p class="muted">Boca abajo.</p></div>'}</div></div>
   <div class="section cards">${c.squad.map(s=>cardHTML(CARDS[s.id],{sq:s,flavor:false})).join('')}</div>
   <p class="small muted">Resultados: ${c.res.map(r=>({W:'G',D:'E',L:'P'})[r]).join(' ')||'—'}</p></div>`).join(''); }
function sheetLog(){ if(!G) return '<p>No hay liga en curso.</p>'; return `<div class="log">${G.log.slice().reverse().map(l=>`<div class="${l.c}">${l.f?`<span class="muted small">F${l.f} · </span>`:''}${esc(l.t)}</div>`).join('')}</div>`; }
function sheetMenu(){
  return `<div class="opts">
   <button class="btn alt" data-sheet="fixture">Fixture</button>
   <button class="btn alt" data-sheet="reglas">Cómo se juega</button>
   <button class="btn alt" id="mUndo" ${UNDO.length?'':'disabled'}>Deshacer la última decisión</button>
   <button class="btn alt" id="mTheme">Tema: ${({dark:'oscuro',light:'claro'})[document.documentElement.getAttribute('data-theme')]||'automático'}</button>
   <button class="btn warn" id="mNew">Nueva liga</button>
  </div>
  <details style="margin-top:16px"><summary class="muted" style="cursor:pointer;font-weight:700">Herramientas de prueba</summary><div class="opts" style="margin-top:8px">
   <button class="btn alt sm" data-sheet="cartas">Todas las cartas</button>
   <button class="btn alt sm" data-sheet="registro">Registro de la liga</button>
   <button class="btn alt sm" data-sheet="lab">Laboratorio de balance</button>
   ${G&&G.phase!=='end'?'<button class="btn alt sm" id="mBots">Que los bots jueguen el resto</button>':''}
   <button class="btn alt sm" id="mPriv">${G&&G.privacy?'Quitar':'Activar'} pantalla entre turnos</button>
   <button class="btn alt sm" id="mExport">Copiar estado para reportar un bug</button>
  </div></details>`;
}
function sheetCartas(){
  const sec=(t,h)=>`<div class="section"><h3>${t}</h3>${h}</div>`;
  return sec('Plantilla Base (48)',`<div class="cards">${BASE_RAW.map(r=>cardHTML(CARDS[r[0]])).join('')}</div>`)+
   sec('Jugadores Libres (30)',`<div class="cards">${LIBRES_RAW.map(r=>cardHTML(CARDS[r[0]],{cost:{m:CARDS[r[0]].cm,f:CARDS[r[0]].cf}})).join('')}</div>`)+
   [['Eventos',EVENTOS,'evt'],['Excusas',EXCUSAS,'exc'],['Auspiciadores',SPONSORS,'spo'],['Dramas',DRAMAS.filter(x=>!x.good),'dra'],['Buenas noticias',DRAMAS.filter(x=>x.good),'dra good'],['Promesas al Barrio',OBJETIVOS,'obj'],['Clásicos',CLASICOS,'cla']].map(([t,a,k])=>sec(`${t} (${a.length})`,`<div class="grid2">${a.map(x=>plainCard(k,t.replace(/s$/,''),x)).join('')}</div>`)).join('');
}
function sheetReglas(){ return RULES_HTML; }
function sheetLab(){
  const r=UI.labRes;
  return `<p>Corre ligas completas con bots en todos los clubes gestionados y muestra cómo queda el balance. Sirve para probar cambios en los números antes de jugarlos en mesa.</p>
  <div class="grid2 section"><label class="field">Clubes gestionados (resto Vecinos)<select id="labN">${[1,2,3,4,5,6].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Ligas a simular<select id="labL"><option>50</option><option selected>200</option><option>500</option></select></label>
  <label class="field">Vecino: Nivel + (Ataque)<input id="labVA" type="number" value="${CFG.VEC_ATK}"></label><label class="field">Vecino: Nivel + (Defensa)<input id="labVD" type="number" value="${CFG.VEC_DEF}"></label>
  <label class="field">Base de Defensa ("el arco")<input id="labDB" type="number" value="${CFG.DEF_BASE}"></label><label class="field">Físico recuperado al descansar<input id="labRR" type="number" value="${CFG.REST_REC}"></label></div>
  <p class="small muted">Los valores cambian también para la liga en curso desde la próxima jugada. Se reinician al recargar la página.</p>
  <button class="btn section" id="labGo">Simular</button>
  <div id="labOut" class="section lab-out">${r?labHTML(r):''}</div>`;
}
function labHTML(a){ const hv=a.hvv,t=hv.w+hv.d+hv.l||1; const top=Object.entries(a.scoreDist).sort((x,y)=>y[1]-x[1]).slice(0,6);
  return `<table><tr><td>Goles por partido</td><td><b>${(a.goals/a.matches).toFixed(2)}</b></td></tr><tr><td>Empates</td><td><b>${(100*a.draws/a.matches).toFixed(0)}%</b></td></tr>
  <tr><td>Gestionado vs Vecino (gana / empata / pierde)</td><td><b>${[hv.w,hv.d,hv.l].map(x=>Math.round(100*x/t)+'%').join(' / ')}</b></td></tr>
  <tr><td>Campeón: club gestionado</td><td><b>${Math.round(100*a.champ.mgd/a.leagues)}%</b></td></tr>
  <tr><td>Penalización media por Físico en la alineación</td><td><b>${(a.fisPen/a.fisN).toFixed(1)}</b></td></tr>
  <tr><td>Dinero / Reputación al final (promedio)</td><td><b>${(a.money/a.mgdN).toFixed(1)} / ${(a.rep/a.mgdN).toFixed(1)}</b></td></tr>
  <tr><td>Fichajes por club</td><td><b>${(a.libres/a.mgdN).toFixed(1)}</b></td></tr>
  <tr><td>Marcadores más comunes</td><td><b>${top.map(([k,v])=>k+' ('+Math.round(100*v/a.matches)+'%)').join(', ')}</b></td></tr></table>`; }
function bindSheet(which){
  bindGlobal();
  if(which==='tabla') document.querySelectorAll('[data-tt]').forEach(b=>b.onclick=()=>{UI.tabTab=b.dataset.tt;openSheet('tabla')});
  if(which==='clubes') document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{UI.clubTab=+b.dataset.ct;openSheet('clubes')});
  if(which==='menu'){
    const on=(id,f)=>{const el=$('#'+id); if(el) el.onclick=f;};
    on('mUndo',()=>{closeSheet();undo()});
    on('mBots',()=>{ if(!confirm('Todos los clubes humanos pasan a Bot y la liga se juega sola hasta el final. ¿Seguir?')) return; snapshot(); humanClubs(G).forEach(c=>c.ctrl='bot'); let g=0; while(G.phase!=='end'&&g++<60){ runBots(G); const t=G.queue[0]; if(t&&t.type==='show'&&(t.what==='fecha'||t.what==='summary')){G.queue.shift();startPhase2(G)} else if(!t||t.type==='show') break; } resetUI(); save(); closeSheet(); render(); });
    on('mPriv',()=>{ if(G){G.privacy=!G.privacy;save();} openSheet('menu'); render(); });
    on('mTheme',()=>{ const cur=document.documentElement.getAttribute('data-theme'); const nx=cur===null?'dark':cur==='dark'?'light':null; try{ if(nx) localStorage.setItem(TKEY,nx); else localStorage.removeItem(TKEY);}catch(e){} applyTheme(); openSheet('menu'); });
    on('mExport',async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(G)); toast('Estado copiado al portapapeles'); }catch(e){ toast('No se pudo copiar'); } });
    on('mNew',newLeague);
  }
  if(which==='lab'){ $('#labGo').onclick=()=>{ const n=+$('#labN').value, L=+$('#labL').value;
    CFG.VEC_ATK=+$('#labVA').value; CFG.VEC_DEF=+$('#labVD').value; CFG.DEF_BASE=+$('#labDB').value; CFG.REST_REC=+$('#labRR').value;
    $('#labOut').textContent='Simulando…'; setTimeout(()=>{ const seats=Array.from({length:6},(_,i)=>i<n?'bot':'vecino'); UI.labRes=simLeagues(L,seats,Date.now()%100000); $('#labOut').innerHTML=labHTML(UI.labRes); },30); }; }
}


// ================= INTERFAZ v2 (pantallas) =================
const dispName=k=>k.first?`${k.first.replace(/^"Profe" /,'')} ${k.last}`:`"${k.nick}" ${k.last}`;
const EV_ICO={luz:'💡',lluvia:'🌧️',arbitro:'🟨',parlante:'🔇',fisca:'📋',red:'🥅',cumple:'🎂',reportaje:'🎥',balon:'⚽',largo:'⏱️',cancha:'🚐',kermes:'🎡'};
function pipsHTML(s){ const cls=s.fis===0?'zero':s.fis<FIS_MAX?'low':''; return `<span class="pips ${cls}" title="Físico ${s.fis} de ${FIS_MAX}">${Array.from({length:FIS_MAX},(_,i)=>`<i class="${i<s.fis?'on':''}"></i>`).join('')}</span>`; }
function sqTags(s){ const t=[]; if(!s) return t; if(s.retired) t.push('<span class="tag">Retirado</span>'); if(s.suspNow) t.push('<span class="tag bad">Sancionado</span>'); if(s.dramaOut) t.push('<span class="tag bad">No viene</span>'); if(s.legend) t.push('<span class="tag good">Leyenda</span>'); if(s.susp>0&&!s.suspNow) t.push('<span class="tag bad">Sancionado la próxima</span>'); return t; }

function mainStat(k){ const g=POS[k.pos].g; if(g==='gk'||g==='def') return [k.d,'DEF']; if(g==='del') return [k.a,'ATA']; return k.a>=k.d?[k.a,'ATA']:[k.d,'DEF']; }
function cardHTML(k,o={}){
  const s=o.sq, g=POS[k.pos].g, [mv,ml]=mainStat(k);
  const tags=sqTags(s); if(o.extraTag) tags.push(o.extraTag);
  const cost=k.libre&&o.cost?`<span class="price">$${o.cost.m}${o.cost.f?` + ${o.cost.f} Favor`:''}</span>`:'';
  const bottom=(s||cost||tags.length)?`<div class="bot">${s?pipsHTML(s):'<span></span>'}<span class="row" style="gap:4px">${tags.join('')}${cost}</span></div>`:'';
  return `<div class="pc g-${g} ${o.cls||''}" ${o.attrs||''}><div class="top"><div class="val">${o.val!=null?o.val:mv}<small>${ml}</small></div><div class="who"><b>${esc(dispName(k))}</b><span>${POS[k.pos].n}</span><div class="statpair"><span>Ataque ${k.a}</span><span>Defensa ${k.d}</span></div></div><span class="num">${k.num}</span></div><div class="eff">${esc(k.t)}</div>${bottom}${o.after||''}</div>`;
}
function spoDur(id){ const d=SPO[id].dur; return d==='c'?'Hasta el Clásico':`Dura ${d} Fechas`; }
function plainCard(type,label,x,extra){ extra=extra||{};
  return `<div class="xc ${type} ${extra.cls||''}" ${extra.attrs||''}><div class="xh"><b>${esc(x.n)}</b><small>${esc(label)}</small></div><div class="xb">${esc(x.t)}${extra.after||''}</div></div>`; }
function resBar(c){
  const mm=moralMod(c.moral), hm=homeMod(c.hinchada);
  const fx=(n,txt)=>`<span class="fx ${n>0?'pos':n<0?'neg':'zero'}">${txt}</span>`;
  const moralFill = c.moral>=5 ? `left:50%;width:${(c.moral-5)*10}%;background:var(--good)` : `left:${c.moral*10}%;width:${(5-c.moral)*10}%;background:var(--bad)`;
  return `<div class="res">
   <div class="coin" title="Paga Excusas, fichajes, Dramas, kinesiólogo e inversión. Entra cada Fecha: cuota 2, taquilla 1 de local y el Auspiciador."><b>$${c.money}</b><span>Dinero</span></div>
   <div class="coin" title="Pagan fichajes, Dramas y recuperan Físico. Se piden al barrio por Reputación."><b>${c.favors}</b><span>Favores</span></div>
   <div class="bars">
    <div class="bar" title="Moral: arriba de 6 suma y abajo de 4 resta a Ataque y Defensa en cada partido."><span class="lbl">Moral ${c.moral}</span><div class="track2"><span class="fill" style="${moralFill}"></span><span class="mid"></span></div>${fx(mm,mm?sg(mm)+' A y D':'sin efecto')}</div>
    <div class="bar" title="Hinchada Fiel: de local suma +1 Ataque desde 3 y +2 desde 6."><span class="lbl">Hinchada ${c.hinchada}</span><div class="track2"><span class="fill" style="left:0;width:${c.hinchada*10}%;background:var(--turq)"></span><span class="tick" style="left:30%"></span><span class="tick" style="left:60%"></span></div>${fx(hm,hm?sg(hm)+' de local':'sin bono')}</div>
    <div class="bar" title="Reputación: no cambia el partido. Desempata la tabla y se cambia por Favores."><span class="lbl">Reputación ${c.rep}</span><div class="track2"><span class="fill" style="left:0;width:${c.rep/30*100}%;background:var(--gold)"></span></div><span class="fx zero">desempate</span></div>
   </div></div>`;
}
const STEP_KEYS={lineup:0,excuse:1,fecha:2,tt:3,market:4};
function stepsHTML(key){
  if(!G||G.phase==='pre') return `<div class="steps">${['Auspiciador','Mercado'].map((l,i)=>`<span class="${(key==='market'?1:0)===i?'now':(key==='market'&&i===0?'done':'')}">${l}</span>`).join('')}</div>`;
  const list=['Alineación','Excusa','Partido','Tercer Tiempo']; if(G.fecha<=3) list.push('Mercado'); else if(G.fecha<=6&&!G.clubs.some(c=>c.squad.some(s=>s.id==='l30'))) list.push('Refuerzo');
  const cur=STEP_KEYS[key];
  return `<div class="steps">${list.map((l,i)=>`<span class="${i===cur?'now':i<cur?'done':''}">${l}</span>`).join('')}</div>`;
}
function objBanner(c){
  if(!c.objNews) return '';
  return c.objNews==='done' ? `<div class="banner good"><span style="font-size:1.8rem">🏆</span><div><b>Promesa cumplida</b>«${esc(OBJ[c.obj].n)}»: ya tenés el premio y +2 puntos.</div></div>` : `<div class="banner bad"><span style="font-size:1.8rem">😞</span><div><b>Promesa perdida</b>«${esc(OBJ[c.obj].n)}» ya no se puede cumplir: −1 Moral.</div></div>`;
}
function head(c,title,key){ const t=G.queue[0]; return `<div class="screen-head"><div class="who">${crest(c.i)}<div><div class="kicker">${esc(clubName(c.i))}${c.ctrl==='human'&&c.player?' · '+esc(c.player):''}</div><h2>${title}</h2></div></div><div class="kicker">${phaseLabel()}</div></div>${stepsHTML(key||(t&&t.type))}`; }
function sideHTML(){
  document.querySelectorAll('#navbtns [data-sheet="tabla"],#navbtns [data-sheet="clubes"]').forEach(b=>b.classList.toggle('hide',!G));
  if(!G) return '';
  const h=G.queue[0], me=h&&h.ci!=null?h.ci:null;
  return `<div class="panel"><h3>Tabla</h3>${tableHTML(true,me)}</div><div class="panel"><h3>${G.fecha<CLASICO_FECHA||(G.fecha===CLASICO_FECHA&&G.phase==='f1')?'Clásicos · Fecha 4':'Copas de Lata'}</h3>${rivalryHTML()}</div><div class="panel"><h3>Goleadores</h3>${scorersHTML(5,goalsUpTo())}</div>`;
}

// ---------- setup ----------
function setupHTML(){
  const st=UI.setup||{seats:CLUBS.slice(0,6).map((c,i)=>({ctrl:i<3?'human':'vecino',name:i<3?'Jugador '+(i+1):''})),privacy:true,random:true,seed:''};
  st.seats.forEach(s=>{ if(s.ctrl==='bot') s.ctrl='vecino'; });
  UI.setup=st;
  const n=st.seats.filter(s=>s.ctrl==='human').length;
  return `<section class="hero"><div class="lines"></div><h1>Tercer<span>Tiempo</span></h1><p>El partido se juega en la cancha. El club se gana después.</p></section>
  <div class="screen-head"><h2>¿Quiénes juegan?</h2><span class="kicker">${n} ${n===1?'jugador':'jugadores'} · el resto son Clubes Vecinos</span></div>
  <div class="seats">${st.seats.map((s,i)=>`<div class="seat2" style="--cc:${CLUBS[i].c}"><div class="shirt">${crest(i)}${esc(CLUBS[i].n)}</div><div class="inner"><div class="seg2"><button data-seat="${i}" data-v="human" class="${s.ctrl==='human'?'on':''}">Jugador</button><button data-seat="${i}" data-v="vecino" class="${s.ctrl!=='human'?'on':''}">Vecino</button></div>${s.ctrl==='human'?`<input data-name="${i}" placeholder="Nombre" value="${esc(s.name)}" style="font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)">`:''}</div></div>`).join('')}</div>
  <div class="blk"><label class="toggle"><input type="checkbox" id="optRandom" ${st.random?'checked':''}> Sortear qué club le toca a cada jugador</label>
  <label class="toggle" style="margin-top:8px"><input type="checkbox" id="optPrivacy" ${st.privacy?'checked':''}> Ocultar la pantalla entre turnos (para pasarse el teléfono)</label>
  <details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-weight:600">Opciones avanzadas</summary><label class="field" style="margin-top:8px">Semilla para repetir una liga<input id="optSeed" inputmode="numeric" value="${esc(st.seed)}" placeholder="Al azar"></label></details></div>
  <p class="problems" id="setupMsg"></p>`;
}
function bindSetup(){
  document.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.seat, s=UI.setup.seats[i]; s.ctrl=b.dataset.v; if(s.ctrl==='human'&&!s.name) s.name='Jugador '+UI.setup.seats.filter(x=>x.ctrl==='human').length; render(); });
  document.querySelectorAll('[data-name]').forEach(el=>el.oninput=()=>UI.setup.seats[+el.dataset.name].name=el.value);
  $('#optRandom').onchange=e=>UI.setup.random=e.target.checked;
  $('#optPrivacy').onchange=e=>UI.setup.privacy=e.target.checked;
  $('#optSeed').oninput=e=>UI.setup.seed=e.target.value;
  setAction(`<button class="btn alt" data-sheet="reglas">Cómo se juega</button><button class="btn" id="startBtn">Armar la liga</button>`);
  $('#startBtn').onclick=()=>{
    const st=UI.setup;
    if(!st.seats.some(s=>s.ctrl==='human')){ $('#setupMsg').textContent='Elegí al menos un club con Jugador.'; return; }
    G=newGame({seats:st.seats.map(s=>({ctrl:s.ctrl,name:(s.name||'').trim()})),randomClubs:st.random,seed:parseInt(st.seed,10)||0,privacy:st.privacy});
    UNDO=[]; resetUI(); save(); render();
  };
}

  app.innerHTML=head(c,'Pretemporada','pre')+resBar(c)+`
  <div class="blk"><h3>Elegí tu Auspiciador</h3><div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${c.spoChoices.map(id=>plainCard('spo',spoDur(id),SPO[id],{cls:'pick'+(UI.sel===id?' on':''),attrs:`data-spo="${id}" tabindex="0" role="button"`})).join('')}</div></div>
  <div class="blk"><h3>Tu Promesa al Barrio <span class="tag">Secreta</span></h3>${plainCard('obj','Objetivo',OBJ[c.obj])}</div>
  <div class="blk"><h3>Tu plantel</h3><div class="cards">${c.squad.map(s=>cardHTML(CARDS[s.id])).join('')}</div></div>`;
  document.querySelectorAll('[data-spo]').forEach(el=>{ const f=()=>{UI.sel=el.dataset.spo;render()}; el.onclick=f; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')f()}; });
  setAction(`<span class="muted">${UI.sel?esc(SPO[UI.sel].n):'Elegí un Auspiciador'}</span><button class="btn" id="go" ${UI.sel?'':'disabled'}>Firmar</button>`);
  $('#go').onclick=()=>{ snapshot(); signSponsor(G,c,UI.sel,true); G.decks.spo.unshift(...c.spoChoices.filter(x=>x!==UI.sel)); c.spoChoices=null; advance(); };
}

  const list=marketList(G,c,t), tab=UI.mkTab||'o';
  const late=G.fecha>=4, n=c.squad.filter(s=>CARDS[s.id].libre&&!s.retired).length;
  app.innerHTML=head(c,late?'Refuerzo de última hora':'Mercado')+resBar(c)+`
  <div class="seg3" style="margin-top:12px"><button data-mk="o" class="${tab==='o'?'on':''}">Ofertas (${list.length})</button><button data-mk="p" class="${tab==='p'?'on':''}">Mi plantel (${c.squad.filter(s=>!s.retired).length})</button></div>
  ${tab==='p'?`<div class="cards">${c.squad.filter(s=>!s.retired).map(s=>cardHTML(CARDS[s.id],{sq:s})).join('')}</div>`:`
  <p class="muted" style="margin-top:0">${late?'Si lo fichás, nadie más puede.':`Tus ${list.length} ofertas de esta Fecha · fichá 1 como máximo · llevás ${n} de 4 fichados`}</p>
  <div class="cards">${list.length?list.map(id=>{ const why=canSign(G,c,id); return cardHTML(CARDS[id],{cost:libreCost(G,c,id),cls:(why?'off':'pick')+(UI.sel===id?' on':''),attrs:why?'':`data-sign="${id}" tabindex="0" role="button"`,extraTag:why?`<span class="tag bad">${esc(why)}</span>`:''}); }).join(''):'<p class="muted">No quedan jugadores.</p>'}</div>`}`;
  document.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{UI.mkTab=b.dataset.mk;render()});
  document.querySelectorAll('[data-sign]').forEach(el=>{ const f=()=>{UI.sel=UI.sel===el.dataset.sign?null:el.dataset.sign;render()}; el.onclick=f; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')f()}; });
  setAction(`<button class="btn alt" id="pass">No fichar</button><button class="btn" id="go" ${UI.sel?'':'disabled'}>${UI.sel?'Fichar a '+esc(CARDS[UI.sel].short):'Tocá un jugador'}</button>`);
  $('#pass').onclick=()=>{ snapshot(); UI.mkTab='o'; log(G,`${clubName(c.i)} no ficha.`); advance(); };
  $('#go').onclick=()=>{ snapshot(); UI.mkTab='o'; signLibre(G,c,UI.sel); advance(); };
}

// ---------- alineación (cancha) ----------
function opponentOf(ci){ const m=FIXTURE[G.fecha-1].find(([h,a])=>h===ci||a===ci); return {opp:m[0]===ci?m[1]:m[0],home:m[0]===ci}; }
function lineupCtx(c){ const {opp,home}=opponentOf(c.i); const cl=G.fecha===CLASICO_FECHA?CLASICO_PAIRS.findIndex(p=>(p[0]===c.i&&p[1]===opp)||(p[1]===c.i&&p[0]===opp)):-1; return {opp,home,cl}; }
function previewSide(c,L){
  const S2=JSON.parse(JSON.stringify(G)), c2=S2.clubs[c.i]; const x=lineupCtx(c);
  c2.lineup={gk:L.gk,D:L.D.slice(),A:L.A.slice(),wilsonHold:!!L.wilsonHold}; S2.event=null; S2.log=[];
  return sideOf(S2,c.i,x.home,x.opp,x.cl>=0?{preview:true,clasico:x.cl}:{preview:true});
}
function moved(L,id,to){ const M={gk:L.gk,D:L.D.filter(x=>x!==id),A:L.A.filter(x=>x!==id),wilsonHold:L.wilsonHold}; if(M.gk===id) M.gk=null; if(to==='G') M.gk=id; else if(to==='D') M.D.push(id); else if(to==='A') M.A.push(id); return M; }
function slotValue(c,L,id,slot){ const sd=previewSide(c,moved(L,id,slot)); const p=sd.players.find(p=>p.id===id); return p?p.v:0; }
function tokHTML(c,s,slot,sel,pv){
  const k=CARDS[s.id], ok=available(G,c,s);
  let v; if(pv){ const p=pv.players.find(p=>p.id===s.id); v=p?p.v:0; }
  if(v==null) v = slot==='G'?lineValue(G,c,s,'D','G') : slot==='D'?lineValue(G,c,s,'D','D') : slot==='A'?lineValue(G,c,s,'A','A') : Math.max(lineValue(G,c,s,'A','A'),lineValue(G,c,s,'D','D'));
  const pen=s.fis<=0?'<span class="pen">−2</span>':'';
  return `<button class="tok g-${POS[k.pos].g} ${sel?'sel':''} ${ok?'':'off'}" data-tok="${s.id}" ${ok?'':'disabled'} aria-label="${esc(dispName(k))}, vale ${v}"><span class="tv">${v}</span><span class="tn">${esc(k.short)}</span>${pipsHTML(s)}${pen}${ok?'':'<span class="badge">fuera</span>'}</button>`;
}
// editor de alineación reutilizable (alineación y rearmado tras Excusa)
function pitchEditor(app,c,o){
  const L=o.L, x=lineupCtx(c), O=G.clubs[x.opp];
  const pv=previewSide(c,L), probs=lineupProblems(G,c,L);
  const get=id=>c.squad.find(s=>s.id===id), inL=id=>L.gk===id||L.D.includes(id)||L.A.includes(id);
  const bench=c.squad.filter(s=>!s.retired&&!inL(s.id)), sel=UI.sel, selS=sel?get(sel):null;
  const oppStat = O.ctrl==='vecino' ? `A ${vecLevel(G,x.opp)+CFG.VEC_ATK} · D ${vecLevel(G,x.opp)+CFG.VEC_DEF}` : `Moral ${O.moral}`;
  const rowHTML=(ids,slot)=>{ if(!ids.length) return '';
    // orden izquierda → centro → derecha; la fila se reparte pareja (2 quedan simétricos, 3 forman izquierda-centro-derecha)
    let l=0,r=0; const key=id=>{ const p=CARDS[id].pos; if(p==='DI') return 0; if(p==='DD') return 2; if(p==='EXT'){ if(r<=l){r++;return 2.5} l++; return -0.5; } return 1; };
    const ord=ids.map(id=>({id,k:key(id)})).sort((a,b)=>a.k-b.k);
    return `<div class="frow">${ord.map(o=>tokHTML(c,get(o.id),slot,sel===o.id,pv)).join('')}</div>`; };
  const zone=(label,total,ids,slot)=>{ let rows;
    if(slot==='A'){ const fw=ids.filter(i=>POS[CARDS[i].pos].g==='del'), mid=ids.filter(i=>!fw.includes(i)); rows=rowHTML(fw,slot)+rowHTML(mid,slot); }
    else if(slot==='D'){ const back=ids.filter(i=>['def','gk'].includes(POS[CARDS[i].pos].g)), dm=ids.filter(i=>!back.includes(i)); rows=rowHTML(dm,slot)+rowHTML(back,slot); }
    else rows=rowHTML(ids,slot);
    return `<div class="zone ${sel?'target':''}" data-zone="${slot}"><div class="zh"><span>${label}</span>${total!=null?`<b>${total}</b>`:''}</div>${rows||'<div class="frow"><span class="empty">Tocá un jugador y después acá</span></div>'}</div>`; };
  const hasW=[L.gk,...L.D,...L.A].some(id=>id&&CARDS[id].fx==='wilson')&&!c.flags.wilsonUsed;
  app.innerHTML=head(c,o.title,o.step)+objBanner(c)+(o.top||'')+`
  <div class="opp">${x.cl>=0?'<span class="tag" style="background:var(--amarillo);color:#2A2205;border:0">Clásico</span>':''}<span class="vs">${x.home?'Local':'Visita'} vs</span>${crest(x.opp,true)}<b>${esc(clubName(x.opp))}</b><span class="st muted">${oppStat}</span></div>
  ${(o.notes||[]).map(n=>`<div class="note">${esc(n)}</div>`).join('')}
  <div class="pitch"><span class="circle"></span><span class="area"></span>
   ${zone('Ataque',pv.atk,L.A,'A')}${zone('Defensa (con arquero)',pv.def,L.D,'D')}${zone('Arco',null,L.gk?[L.gk]:[],'G')}
  </div>
  <p class="small muted" style="margin:8px 2px 0">Los totales ya incluyen Moral, local y efectos de las cartas. El Evento se suma después.</p>
  <div class="bench ${sel&&inL(sel)?'target':''}" data-zone="B"><div class="zh"><span>Banco</span><span>${bench.length}</span></div><div class="row">${bench.length?bench.map(s=>tokHTML(c,s,'B',sel===s.id)).join(''):'<span class="muted">Nadie en el banco</span>'}</div></div>
  ${hasW?`<label class="toggle blk"><input type="checkbox" id="wHold" ${L.wilsonHold?'checked':''}> Guardar el efecto de Wilson para otra Fecha</label>`:''}`;
  const move=(id,to)=>{ const M=moved(L,id,to); L.gk=M.gk; L.D=M.D; L.A=M.A; UI.sel=null; render(); };
  document.querySelectorAll('[data-tok]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); UI.sel=UI.sel===b.dataset.tok?null:b.dataset.tok; render(); });
  document.querySelectorAll('[data-zone]').forEach(z=>z.onclick=()=>{ if(UI.sel) move(UI.sel,z.dataset.zone); });
  const wh=$('#wHold'); if(wh) wh.onchange=e=>{L.wilsonHold=e.target.checked; render();};
  if(selS){
    const k=CARDS[sel], vA=slotValue(c,L,sel,'A'), vD=slotValue(c,L,sel,'D'), vG=slotValue(c,L,sel,'G');
    const p=pv.players.find(p=>p.id===sel);
    const extra=[]; if(selS.fis<=0) extra.push('Sin Físico: juega con −2.'); if(p&&p.notes.length) extra.push('Ahora: '+p.notes.join(', ')+'.');
    setAction(`<div class="sheetcard"><div>${tokHTML(c,selS,'B',true,inL(sel)?pv:null)}</div><div><b>${esc(dispName(k))}</b> <span class="muted small">${POS[k.pos].n}</span><div class="eff">${esc(k.t)}</div>${extra.length?`<div class="small" style="color:var(--bad);font-weight:600">${esc(extra.join(' '))}</div>`:''}<div class="movebtns"><button class="btn sm" data-mv="A">Ataque ${vA}</button><button class="btn sm" data-mv="D">Defensa ${vD}</button><button class="btn sm" data-mv="G">Arco ${vG}</button><button class="btn sm alt" data-mv="B">Banco</button></div></div></div>`);
    document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>move(sel,b.dataset.mv));
  } else {
    setAction(`<span class="problems">${probs.map(esc).join(' · ')||'<span class="muted" style="font-weight:500">Tocá un jugador para moverlo.</span>'}</span><span class="row">${o.suggest?'<button class="btn alt" id="sug">Sugerida</button>':''}<button class="btn" id="go" ${probs.length?'disabled':''}>${o.doneLabel||'Listo'}</button></span>`);
    const sb=$('#sug'); if(sb) sb.onclick=o.suggest;
    $('#go').onclick=()=>o.onDone(L);
  }
}
function screenLineup(app,c){
  if(!UI.lineup){ autoLineup(G,c); UI.lineup={gk:c.lineup.gk,D:c.lineup.D.slice(),A:c.lineup.A.slice()}; c.lineup=null; }
  const L=UI.lineup;

  if(ex.reform){
    if(!UI.lineup) UI.lineup={gk:c.lineup.gk,D:c.lineup.D.slice(),A:c.lineup.A.slice(),wilsonHold:c.lineup.wilsonHold};
    pitchEditor(app,c,{L:UI.lineup,title:'Rearmá el equipo',step:'excuse',doneLabel:'Confirmar',

    const bench=c.squad.filter(s=>available(G,c,s)&&s.id!==ex.sid&&!L.played.includes(s.id));
    app.innerHTML=head(c,half?'¿Quién juega el 1.er tiempo?':'¿Quién entra?')+`<p class="muted">${half?`Cubre a ${esc(k.short)} hasta el entretiempo.`:`Reemplaza a ${esc(k.short)}.`}</p>
    <div class="bench" style="margin-top:6px"><div class="row">${bench.map(s=>tokHTML(c,s,slot==='G'?'G':line,UI.sel===s.id)).join('')||'<span class="muted">No hay nadie en el banco.</span>'}</div></div>`;
    document.querySelectorAll('[data-tok]').forEach(b=>b.onclick=()=>{UI.sel=b.dataset.tok;render()});
    setAction(`<button class="btn alt" id="none">Jugar con uno menos</button><button class="btn" id="go" ${UI.sel?'':'disabled'}>${UI.sel?'Entra '+esc(CARDS[UI.sel].short):'Elegí quién entra'}</button>`);
    $('#none').onclick=()=>{snapshot();resolveExcuse(G,c,'accept',null);advance()};
    $('#go').onclick=()=>{snapshot();resolveExcuse(G,c,'accept',UI.sel);advance()};
    return;
  }
  const ops=excuseOptions(G,c), immune=ex.state==='immune';
  app.innerHTML=head(c,'La Excusa')+resBar(c)+`
  <p style="margin:12px 0 0;font-weight:600">La Excusa le tocó a un titular al azar:</p><div class="grid2" style="margin-top:8px;align-items:start"><div>${cardHTML(k,{sq})}</div><div>${plainCard('exc','Excusa',e,{cls:'big'})}
   ${ex.die?`<div class="blk"><span class="die" style="background:var(--pitch);color:var(--chalk);width:34px;height:34px;font-size:1.2rem">${ex.die}</span> <b>${ex.die<=3?'Llega tarde':'Llega a tiempo'}</b></div>`:''}
   ${immune?`<div class="blk"><b class="tag good" style="font-size:1rem">${esc(k.short)} es inmune</b></div>`:''}
   ${ex.alt?`<p class="small muted">Reinaldo: se robaron dos y se aplica la peor.</p>`:''}</div></div>`;
  setAction(`<span></span><span class="row">${ops.map(o=>`<button class="btn ${o.id==='accept'?'alt':''}" data-ex="${o.id}" ${o.ok===false?'disabled':''}>${esc(o.l)}</button>`).join('')}</span>`);
  document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{ const id=b.dataset.ex;
    if(id==='accept' && ['out','outRep','pay1','moral1'].includes(e.k)){ snapshot(); const slot=excuseSlot(c); resolveExcuse(G,c,'accept',null);
      const L=c.lineup; UI.lineup={gk:L.gk,D:L.D.slice(),A:L.A.slice(),wilsonHold:L.wilsonHold}; const best=benchFor(G,c,slot)[0];
      if(best){ if(slot==='G') UI.lineup.gk=best.id; else UI.lineup[slot].push(best.id); ex.autoIn=best.id; }
      UI.sel=null; save(); render(); return; }
    if(id==='accept' && excuseIsHalf(c)){ UI.pickRep=true; UI.sel=null; render(); return; }
    snapshot(); resolveExcuse(G,c,id==='ok'?'ok':id); advance(); });
}

// ---------- jornada ----------
function minuteOf(i,n,r){ return ((r&&r.mins&&r.mins[i])||Math.round((i+0.5)*90/n))+"'"; }
function matchCard(r){
  const key=G.fecha+'-'+r.h, rev=UI.reveal[key]||0, shown=Math.min(rev,r.n), done=shown>=r.n;
  const g=[0,0]; r.oc.slice(0,shown).forEach(o=>o.lines.forEach(l=>{if(l.goal)g[l.k]++}));
  const cl=r.clasico>=0?CLASICO_PAIRS[r.clasico]:null;
  const A=r.sides[0], B=r.sides[1];
  const lo=shown?r.oc[shown-1]:null;
  const cur={ha:lo?lo.lines[0].atk:A.atk, hd:lo?lo.lines[1].def:A.def, aa:lo?lo.lines[1].atk:B.atk, ad:lo?lo.lines[0].def:B.def};
  const dl=(now,base)=>{ const d=now-base; return d?`<em class="dlt ${d>0?'up':'dn'}">${d>0?'+':'−'}${Math.abs(d)}</em>`:''; };
  const bar=(lab,x,y,bx,by)=>{ const m=Math.max(x,y,1); return `<div class="st-row"><span class="lab">${lab}${lo?` · ${minuteOf(shown-1,r.n,r)}`:''}</span><span>${x}${dl(x,bx)}</span><div class="st-bars"><i><b style="width:${x/m*100}%"></b></i><i><b style="width:${y/m*100}%"></b></i></div><span class="r">${dl(y,by)}${y}</span></div>`; };
  const det=l=>`<span class="dc">${l.atk}+${l.rA} vs ${l.def}+${l.rD}</span>${l.mods.length||l.note?`<span class="dc mods2">${esc([...l.mods,l.note].filter(Boolean).join(' · '))}</span>`:''}`;
  const ev=(l)=>(l.goal?`<span class="g">${esc(l.scorer?personName(l.scorer):'Gol')}</span>`:`<span class="n">${l.anul?'Gol anulado':'Atajada'}</span>`)+det(l);
  const status = done?'<span>Final</span>':shown===0?'<span>Por jugar</span>':`<span class="live">${minuteOf(shown-1,r.n,r)}</span>`;
  return `<div class="mc" data-mc="${key}">
   ${cl?`<div class="cl">${esc(cl[2])}</div>`:''}
   <div class="mc-head"><div class="mc-team">${crest(r.h)}<span>${esc(clubName(r.h))}</span></div><div class="mc-score"><b>${g[0]} - ${g[1]}</b>${status}</div><div class="mc-team">${crest(r.a)}<span>${esc(clubName(r.a))}</span></div></div>
   <div class="mc-stats">${bar('Ataque',cur.ha,cur.aa,A.atk,B.atk)}${bar('Defensa',cur.hd,cur.ad,A.def,B.def)}</div>
   <p class="mc-note">${lo?'En verde o rojo, cuánto cambió en esta ocasión respecto de la base.':'Valores base del partido. En cada ocasión pueden cambiar.'}</p>
   ${shown?`<div class="mc-tl">${r.oc.slice(0,shown).map((o,i)=>`<div class="ev-row ${i===shown-1&&rev?'fresh':''}"><div class="l">${ev(o.lines[0])}</div><span class="min">${minuteOf(i,r.n,r)}</span><div class="r">${ev(o.lines[1])}</div></div>`).join('')}</div>`:''}
   ${!done?`<div class="btnrow"><button class="btn" data-step="${key}" data-n="${r.n}">${shown===0?'▶ Jugar el partido':'Siguiente ocasión'}</button>${shown>0?`<button class="btn alt" data-all="${key}" data-n="${r.n}">Ir al final</button>`:''}</div>`:''}
  </div>
  ${done?`${r.clCard?plainCard('cla','Carta de Clásico',CLA[r.clCard]):''}${r.post.length?`<ul class="post">${r.post.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
  <details class="why"><summary>Ver cómo se calculó</summary><div class="why-grid">${[0,1].map(k=>`<div><b>${esc(CLUBS[r.sides[k].ci].n)}</b><table><tr><td colspan="2"><b>Ataque ${r.sides[k].atk}</b></td></tr>${r.sides[k].bA.map(([l,v])=>`<tr><td>${esc(l)}</td><td>${sg(v)}</td></tr>`).join('')}<tr><td colspan="2"><b>Defensa ${r.sides[k].def}</b></td></tr>${r.sides[k].bD.map(([l,v])=>`<tr><td>${esc(l)}</td><td>${sg(v)}</td></tr>`).join('')}</table></div>`).join('')}</div></details>`:''}`;
}

function celebrateGoal(key,goals){
  const card=document.querySelector(`.mc[data-mc="${key}"]`); if(!card) return;
  const calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fx=document.createElement('div'); fx.className='goalfx'+(calm?' calm':'');
  const cols=['#2BD46A','#F2C230','#FFFFFF',...goals.map(g=>CLUBS[g.ci].c)];
  let conf=''; if(!calm) for(let i=0;i<36;i++){ const x=(Math.random()*2-1)*170, y=-(60+Math.random()*170), rot=Math.random()*720-360; conf+=`<i style="--x:${x.toFixed(0)}px;--y:${y.toFixed(0)}px;--r:${rot.toFixed(0)}deg;background:${cols[i%cols.length]};animation-delay:${(Math.random()*.12).toFixed(2)}s"></i>`; }
  fx.innerHTML=`<div class="conf">${conf}</div><div class="gtxt"><b>¡GOOOL!</b>${goals.map(g=>`<span>${crest(g.ci,true)} ${esc(g.who?personName(g.who):clubName(g.ci))}</span>`).join('')}</div>`;
  card.appendChild(fx); card.classList.add('glow');
  setTimeout(()=>{ fx.remove(); card.classList.remove('glow'); }, calm?1400:2000);
  if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
}
function resultCard(r){ const w=r.g[0]>r.g[1]?0:r.g[1]>r.g[0]?1:-1; const cl=r.clasico>=0; return `<div class="rcard ${cl?'cl':''}"><div class="h ${w===1?'lose':'w'}">${crest(r.h,true)}<span>${esc(clubName(r.h))}</span></div><span class="sc">${r.g[0]} - ${r.g[1]}</span><div class="a ${w===0?'lose':'w'}"><span>${esc(clubName(r.a))}</span>${crest(r.a,true)}</div></div>`; }

     else if(ops.length>1) after=`<div class="opts">${ops.map((o,j)=>opt(`data-dr="${k}" data-j="${j}"`,d.drama[k]===j,!o.ok||o.ok(),o.l)).join('')}</div>`;
     return `<div class="blk">${plainCard(DRA[id].good?'dra good':'dra',DRA[id].good?'Buena noticia':'Drama',DRA[id],{after})}</div>`; }).join('')}
  ${tired.length?`<div class="blk"><h3>Kinesiólogo <span class="muted small" style="font-weight:500">Físico en 0 = juega con −2</span></h3>${tired.map(s=>{ const k=CARDS[s.id], t=d.treat[s.id]; return `<div class="treat"><button class="kname" data-kine="${s.id}"><b>${esc(dispName(k))}</b> <span class="muted small">A ${k.a} · D ${k.d}</span> ${pipsHTML(s)} <span class="muted small">${UI.kine===s.id?'▲':'▼'}</span></button><button class="btn sm alt ${t==='m'?'on':''}" data-tr="${s.id}" data-how="m">+1 · $2</button><button class="btn sm alt ${t==='f'?'on':''}" data-tr="${s.id}" data-how="f" ${s.fis>=FIS_MAX-1?'':''}>+2 · 1 Favor</button></div>${UI.kine===s.id?`<div style="margin:8px 0 4px">${cardHTML(k,{sq:s})}${s.fis<=0?'<p class="small" style="color:var(--bad);font-weight:700;margin:6px 2px">Con Físico 0 juega con −2 en Ataque y Defensa.</p>':''}</div>`:''}`; }).join('')}</div>`:''}
  ${spoBlk}
  <div class="blk"><label class="toggle"><input type="checkbox" id="fav" ${d.favor?'checked':''} ${c.rep>=favorCost(c)?'':'disabled'}> <span><b>Pedir un Favor al barrio</b><br><span class="muted small">${favorCost(c)} de Reputación por 1 Favor</span></span></label></div>
  <details class="blk"><summary style="cursor:pointer;font-weight:700">Tu Promesa al Barrio ${c.objDone?'<span class="tag good">Cumplida</span>':c.objFailed?'<span class="tag bad">Perdida</span>':'<span class="tag">En juego</span>'}</summary><div style="margin-top:10px">${plainCard('obj','Secreta',OBJ[c.obj])}</div></details>`;
  document.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>{d.invest=+b.dataset.inv;render()});
  document.querySelectorAll('[data-fisca]').forEach(el=>el.onclick=()=>{ if(el.classList.contains('dis'))return; d.fisca=el.dataset.fisca; render(); });
  document.querySelectorAll('[data-dr]').forEach(el=>el.onclick=()=>{ if(el.classList.contains('dis'))return; d.drama[+el.dataset.dr]=+el.dataset.j; render(); });
  document.querySelectorAll('[data-roll]').forEach(b=>b.onclick=()=>{ snapshot(); rollDrama(G,c,+b.dataset.roll); save(); render(); });
  document.querySelectorAll('[data-kine]').forEach(b=>b.onclick=()=>{ UI.kine=UI.kine===b.dataset.kine?null:b.dataset.kine; render(); });
  document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{ const id=b.dataset.tr, h=b.dataset.how; if(d.treat[id]===h) delete d.treat[id]; else d.treat[id]=h; render(); });
  document.querySelectorAll('[data-spoo]').forEach(el=>{ const f=()=>{d.spo=d.spo===el.dataset.spoo&&c.spoExpiring?null:el.dataset.spoo;render()}; el.onclick=f; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')f()}; });
  const sl=$('#spoLook'); if(sl) sl.onclick=()=>{d.offer=true;render()};
  const sn=$('#spoNo'); if(sn) sn.onclick=()=>{d.spo=null;render()};
  $('#fav').onchange=e=>{d.favor=e.target.checked;render()};
  setAction(`<span class="problems">${[...new Set(missing)].map(esc).join(' · ')}</span><button class="btn" id="go" ${missing.length?'disabled':''}>Terminar el Tercer Tiempo</button>`);
  $('#go').onclick=()=>{ snapshot(); c.objNews=null; applyTT(G,c,{invest:d.invest,fisca:d.fisca,drama:d.drama,spo:d.spo,favor:d.favor,treat:d.treat}); advance(); };
}

// ---------- arranque ----------
$('#sheetClose').onclick=closeSheet;
$('#sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.target.matches('input')){ e.preventDefault(); undo(); } });
bindSheetButtons();
applyTheme(); load();
try{ if(G && !G.queue) G=null; }catch(e){G=null}
render();

</script>
</body>
</html>
